# 主运行（160 的 4 张卡）：单机 4 卡数据并行，每张卡每步 1 对，梯度平均后更新，每次更新 4 对。
# 步数、warmup、存档都按更新次数计，所以按对数换算：每卡每遍 1977 次（7907 对补齐到 7908，分给 4 张卡），2 遍 3954 次
# 更新（15816 对）；warmup 500 对 = 125 次更新；每 1000 对 = 250 次更新存档。学习率不按卡数放大。
# 提前停的窗口按记录计，每次更新进 4 个记录（各卡一对），200 个记录 = 50 次更新（同 E32 `acc4`）。
base = "_e33"

[optim]
steps = 3954
warmup = 125

[run]
ddp = 4
save_every = 250
halt_window = 200
