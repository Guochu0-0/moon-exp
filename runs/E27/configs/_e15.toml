# E15 的设置（#209）：完全照 E15 的 _rl（以当前模型正常推理的仿射为自估仿射的粗级抽签奖励，分级奖励 d ≤ 16 得 1 − ½(d/8)²，否则 −0.1；每对 16 份，自估仿射为当前模型正常推理、RANSAC 3 px；
# 难版扰动、DINOv2 qkv 加 LoRA r 8、lr 3e-5（LoRA 1e-4）、4000 步的 warmup 500 + cosine）；loo_t02 另设 RLOO、温度 0.2。
# 本实验只训到第 1200 步（lr 调度仍按 4000 步），第 200–1200 步每 50 步存一个带续训状态的 ckpt，只评第 1200 步的 Val、不评 Test；
# 每步记训练批次的逐格量（trace），每 10 步在固定观察集上记一次（obs_every）；另记各部分每步的相对改变量。这些只是记录，不改变训练。
[model]
name = "roma"
lora_r = 8

[optim]
lr = 3e-5
steps = 4000

[aug]
shift = 128.0
shift_disk = true
rot = 20.0
scale = 0.2
photo = false
erase = true

[rloo]
reward = "ref"
trace = true
obs_every = 10

[run]
save_every = 0
save_at = [200, 250, 300, 350, 400, 450, 500, 550, 600, 650, 700, 750, 800, 850, 900, 950, 1000, 1050, 1100, 1150, 1200]
save_optim = true
stop_at = 1200
sweep = "last"
log_update = true
