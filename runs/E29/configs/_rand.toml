# 随机奖励对照（#215）：完全照 E19 gauss8（RLOO、温度 0.3、每对 16 份、只训粗匹配，其余设置同上），只把奖励换成每格独立的
# U(0, 1) 随机数（[rloo] reward = "rand"），与抽签结果无关。不开 frame_mask（它要用自估仿射，随机奖励不算自估仿射）。
# 训到第 2000 步（lr 调度仍按 4000 步），只存第 2000 步的存档；只看训练日志里的熵与最高分位置的概率，不评 Val。
[model]
name = "roma"
lora_r = 8

[optim]
lr = 3e-5
steps = 4000

[aug]
shift = 128.0
shift_disk = true
rot = 20.0
scale = 0.2
photo = false
erase = true

[rloo]
reward = "rand"
baseline = "loo"
temp = 0.3
shape = "gauss"
delta = 8.0

[run]
save_every = 0
save_at = [2000]
save_zero = false
stop_at = 2000
sweep = "last"
