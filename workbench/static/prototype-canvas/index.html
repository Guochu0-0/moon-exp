<!doctype html>

     双击打开即可。B0 / B0m 的方法与指标来自 ../prototype-node-page/data.js（真实结果）；E1–E5 为模拟实验（E1、E3 借用 B0m 的真实结果）。
     B 的缩略图在 img/（从节点页原型的 render_pairs.py 输出里挑的 6 对，不进 git）。拖动、新建只在内存里。别合进 main。 -->

  .nB { width: 280px; background: #fff; border-radius: 18px; padding: 8px; box-shadow: 0 1px 2px rgba(16,18,24,.06), 0 8px 24px rgba(16,18,24,.07); }
  .nB .top { display: flex; align-items: center; gap: 8px; padding: 2px 6px 8px; font-size: 12.5px; }

  .nB .top .k { margin-left: auto; color: #7A7F8A; }
  .nB .top .tag { background: #F1ECDD; color: #7A5B12; border-radius: 6px; padding: 0 7px; font-size: 11.5px; }
  .nB .media { position: relative; height: 196px; border-radius: 12px; overflow: hidden; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 2px; background: #16181D; }

  .nB.off .media { display: grid; place-items: center; grid-template-columns: 1fr; grid-template-rows: 1fr; background: repeating-linear-gradient(135deg, #F3F4F6 0 10px, #ECEEF1 10px 20px); color: #7A7F8A; font-size: 13px; }
  .nB .ttl { padding: 10px 6px 0; font-weight: 500; line-height: 1.4; }
  .nB .meta { padding: 2px 6px 4px; font-size: 12.5px; color: #7A7F8A; }

  .nB .port.in { left: -6px; } .nB .port.out { right: -6px; }

  .gB.c2 { background: rgba(214,145,40,.07); border: 1px solid rgba(214,145,40,.25); }
  .gB.c3 { background: rgba(60,160,110,.07); border: 1px solid rgba(60,160,110,.25); }
  .gB .gt { position: absolute; left: 16px; top: 14px; background: #fff; border-radius: 999px; padding: 4px 12px 4px 10px; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 7px; box-shadow: 0 1px 2px rgba(16,18,24,.06); }

</head>
<body>
<div id="chrome"></div>
<div id="viewport"><div id="world"><svg id="edges"></svg><div id="layer"></div><div id="labels"></div></div></div>
<div class="sw" role="group" aria-label="原型：切换方向（不属于设计）"><button id="prev" aria-label="上一个">‹</button><div class="lab" id="swlab"></div><button id="next" aria-label="下一个">›</button></div>
<div class="toast" id="toast"></div>
<script>
// ---------------- 数据 ----------------
const R = (window.DATA || { runs: {} }).runs, MAIN = 'auc@10';
const PAIRS = ['ROI_035__patch_142', 'ROI_049__patch_13', 'ROI_070__patch_121', 'ROI_075__patch_138', 'ROI_071__patch_25', 'ROI_080__patch_24'];
const methodsOf = ms => Object.entries(ms).filter(([, s]) => s.val).map(([m, s]) => ({ m, auc: s.val.summary[MAIN] })).sort((a, b) => (b.auc ?? -1) - (a.auc ?? -1));
const fam = m => /roma/i.test(m) ? 'roma' : /loftr/i.test(m) ? 'loftr' : 'other';
function real(id, extra) {
  const r = R[id], ms = methodsOf(r.metrics);
  return { id, title: r.meta.title, parent: r.meta.parent || '', init: (r.meta.init || '').split('/')[1] || '', lit: true, baseline: !!r.meta.baseline,
           methods: ms, page: true, ...extra };
}
const e3v = R.B0m?.metrics['anymatch_loftr__zscore_2p5']?.val;
const EXPS = [
  real('B0', { imgs: PAIRS.slice(0, 4).map(p => `img/${p}__B0__anymatch_roma__arr.jpg`) }),
  real('B0m', { imgs: PAIRS.slice(0, 4).map(p => `img/${p}__B0m__anymatch_roma__minmax__arr.jpg`) }),
  { ...real('E1'), methods: [{ m: 'anymatch_roma', auc: R.E1.metrics.main.val.summary[MAIN] }], imgs: PAIRS.slice(2, 6).map(p => `img/${p}__B0m__anymatch_roma__minmax__arr.jpg`) },
  { id: 'E2', title: R.E2?.meta.title || 'SAR 先去斑再匹配', parent: 'E1', lit: false, page: true },
  { id: 'E3', title: 'AnyMatch-LoFTR 微调：逐匹配 reward', parent: 'B0', init: 'anymatch_loftr', lit: true, page: false,
    methods: [{ m: 'anymatch_loftr', auc: e3v?.summary[MAIN] }], imgs: PAIRS.slice(1, 5).map(p => `img/${p}__opt.jpg`), mockImg: true },
  { id: 'E4', title: '加整对 reward：warp 后跨模态结构相似度', parent: 'E3', lit: false, page: false },
  { id: 'E5', title: 'minmax 输入映射下重做自训练', parent: 'B0m', init: 'anymatch_roma__minmax', lit: false, page: false },
];
EXPS.forEach(e => { if (e.methods) { e.n = e.methods.length; e.auc = e.methods[0].auc; e.best = e.methods[0].m; } });
const byId = Object.fromEntries(EXPS.map(e => [e.id, e]));
const NOTES = { n1: 'Test 只在定稿时跑，平时只看 Val。', n2: '先看 3 px 下的失败是整体偏移还是随机噪声，再决定 E4 要不要做。' };
// 各方向的初始坐标（runs/canvas.json 的内容；节点尺寸差别大，原型里各给一套）
const LAYOUT = {
  A: { pos: { B0: [60, 50], B0m: [480, 50], E5: [900, 50], E1: [480, 350], E2: [900, 350], E3: [480, 640], E4: [900, 640] },
       groups: [{ id: 'g1', c: 'c1', x: 30, y: -10, w: 780, h: 290, title: '零样本基线' }, { id: 'g2', c: 'c2', x: 450, y: 580, w: 780, h: 200, title: 'AnyMatch-LoFTR 微调' }],
       notes: [{ id: 'n1', x: 60, y: 350 }, { id: 'n2', x: 1270, y: 640 }] },
  B: { pos: { B0: [60, 80], B0m: [460, 80], E5: [860, 80], E1: [460, 500], E2: [860, 500], E3: [460, 920], E4: [860, 920] },
       groups: [{ id: 'g1', c: 'c1', x: 30, y: 20, w: 740, h: 420, title: '零样本基线' }, { id: 'g2', c: 'c2', x: 430, y: 860, w: 740, h: 420, title: 'AnyMatch-LoFTR 微调' }],
       notes: [{ id: 'n1', x: 60, y: 500 }, { id: 'n2', x: 1220, y: 920 }] },
  C: { pos: { B0: [40, 80], B0m: [340, 80], E5: [660, 80], E1: [340, 320], E2: [660, 320], E3: [340, 560], E4: [660, 560] },
       groups: [{ id: 'g1', c: 'c1', x: 10, y: 20, w: 560, h: 240, title: '零样本基线' }, { id: 'g2', c: 'c2', x: 310, y: 500, w: 580, h: 240, title: 'AnyMatch-LoFTR 微调' }],
       notes: [{ id: 'n1', x: 50, y: 320 }, { id: 'n2', x: 930, y: 560 }] },
};
const S = { v: 'A', L: JSON.parse(JSON.stringify(LAYOUT)), tx: 0, ty: 0, k: 1, sel: null };
const L = () => S.L[S.v];

const pct = x => x == null ? '—' : (x * 100).toFixed(1);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const litN = () => EXPS.filter(e => e.lit).length;
const kids = id => EXPS.filter(e => e.parent === id);
const ico = {
  grid: '<svg class="i" viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="12" r="2.5"/><circle cx="6" cy="18" r="2.5"/><path d="M8.5 6.5c4 0 4 5.5 7 5.5M8.5 17.5c4 0 4-5.5 7-5.5"/></svg>',
  list: '<svg class="i" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>',
  gear: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/></svg>',
  plus: '<svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  note: '<svg class="i" viewBox="0 0 24 24"><path d="M5 4h14v11l-5 5H5z"/><path d="M14 20v-5h5"/></svg>',
  frame: '<svg class="i" viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="13" rx="2"/><path d="M4 10h16"/></svg>',
  fit: '<svg class="i" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
  check: '<svg viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7"/></svg>',
};

// ---------------- 三个方向 ----------------
const V = {
  A: {
    name: '节点图（ComfyUI 式）',
    node(e) {
      let rows = '';
      if (e.lit) {
        const show = e.methods.slice(0, 4);   // 被子实验用作 init 的方法总是显示出来，好接线
        kids(e.id).forEach(c => { if (c.init && !show.some(x => x.m === c.init)) { const m = e.methods.find(x => x.m === c.init); if (m) show.push(m); } });
        rows = show.map(x => `<div class="row"><span class="mn" title="${x.m}">${e.n > 1 ? x.m : '本实验'}</span>
            <div class="bar"><i style="width:${(x.auc || 0) * 100}%"></i><span class="tnum">${pct(x.auc)}</span></div>
            <span class="port out fam-${fam(x.m)}" data-port="out:${e.id}:${x.m}"></span></div>`).join('')
          + (e.n > show.length ? `<div class="more">▸ 另外 ${e.n - show.length} 个方法</div>` : '');
      }
      return `<div class="node nA${e.lit ? '' : ' off'}" data-id="${e.id}" tabindex="0">
        <div class="hdr"><span class="chev">▼</span><span class="nid">${e.id}</span><span class="ttl" title="${esc(e.title)}">${esc(e.title)}</span>${e.baseline ? '<span class="chip">基线</span>' : ''}<span class="st" title="${e.lit ? '已点亮' : '未点亮'}"></span></div>
        <div class="io"><span class="port in" data-port="in:${e.id}"></span><span>父实验</span><span>${e.lit ? 'AUC@10（Val）' : ''}</span><span>子实验</span><span class="port out" data-port="out:${e.id}:_"></span></div>
        ${e.lit ? rows : '<div class="empty">尚无结果</div>'}</div>`;
    },
    note: n => `<div class="noteA" data-note="${n.id}"><div class="hdr">便签</div><div class="body">${esc(NOTES[n.id] || n.text)}</div></div>`,
    group: g => `<div class="gA ${g.c}" data-grp="${g.id}"><div class="gt">${esc(g.title)}</div></div>`,
    edge(a, b, e) {
      const dx = Math.max(60, Math.abs(b[0] - a[0]) * .45), f = e.init ? fam(e.init) : 'none';
      return { svg: `<path class="eA fam-${f}${e.lit ? '' : ' off'}" d="M${a[0]},${a[1]} C${a[0] + dx},${a[1]} ${b[0] - dx},${b[1]} ${b[0]},${b[1]}"/>` };
    },
    chrome: () => `<nav class="A-rail"><span class="logo">M</span><button class="on" title="实验画布">${ico.grid}</button><button title="实验列表">${ico.list}</button><button title="设置" style="margin-top:auto;margin-bottom:12px">${ico.gear}</button></nav>
      <div class="A-tabs"><div class="tab"><span>实验画布</span><i></i></div></div>
      <div class="A-act"><button class="run" data-tool="exp">${ico.plus}新建实验</button><button data-tool="note">便签</button><button data-tool="group">分组框</button>
        <button data-zoom="-1" aria-label="缩小">−</button><span class="pc" id="pc"></span><button data-zoom="1" aria-label="放大">+</button><button data-zoom="fit" aria-label="适应窗口">${ico.fit}</button></div>
      <div class="A-mini"><div class="h">${EXPS.length} 个实验，${litN()} 个已点亮</div><svg id="mini" width="232" height="130"></svg></div>`,
  },
  B: {
    name: '素材卡片（Krea / Flora 式）',
    node: e => `<div class="node nB${e.lit ? '' : ' off'}" data-id="${e.id}" tabindex="0">
        <div class="top"><b>${e.id}</b>${e.baseline ? '<span class="tag">基线</span>' : ''}<span class="k">${e.lit ? (e.n > 1 ? `${e.n} 个方法` : '单方法') : '未点亮'}</span></div>
        <div class="media${e.mockImg ? ' gray' : ''}">${e.lit ? e.imgs.map(s => `<img src="${s}" alt="" draggable="false">`).join('') + `<span class="badge tnum">AUC@10 ${pct(e.auc)}</span>` + (e.mockImg ? '<span class="mock">原型：无渲染图，显示光学原图</span>' : '') : '尚无结果'}</div>
        <div class="ttl">${esc(e.title)}</div>
        ${e.lit && e.n > 1 ? `<div class="meta">Val 最好：${e.best}</div>` : ''}
        ${e.lit ? `<div class="set">▸ 方法与指标</div>` : ''}
        <span class="port in" data-port="in:${e.id}"></span><span class="port out" data-port="out:${e.id}:_"></span></div>`,
    note: n => `<div class="noteB" data-note="${n.id}"><div class="k"><i></i>便签</div>${esc(NOTES[n.id] || n.text)}</div>`,
    group: g => `<div class="gB ${g.c}" data-grp="${g.id}"><div class="gt"><i></i>${esc(g.title)}</div></div>`,
    edge(a, b, e) {
      const dx = Math.max(60, Math.abs(b[0] - a[0]) * .5), mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
      return { svg: `<path class="eB${e.lit ? '' : ' off'}" d="M${a[0]},${a[1]} C${a[0] + dx},${a[1]} ${b[0] - dx},${b[1]} ${b[0]},${b[1]}"/>`,
               html: e.init ? `<span class="lblB" style="left:${mx}px;top:${my}px">from ${e.init}</span>` : '' };
    },
    chrome: () => `<div class="B-crumb"><span class="sq">M</span><span class="dim">moon-exp</span><span class="dim">/</span><span>实验画布</span></div>
      <div class="B-stat">${EXPS.length} 个实验，${litN()} 个已点亮</div>
      <div class="B-tool"><button class="pri" data-tool="exp">${ico.plus}新建实验</button><button data-tool="note">${ico.note}便签</button><button data-tool="group">${ico.frame}分组框</button>
        <span class="sep"></span><button data-zoom="-1" aria-label="缩小">−</button><span class="pc" id="pc"></span><button data-zoom="1" aria-label="放大">+</button><button data-zoom="fit" aria-label="适应窗口">${ico.fit}</button></div>`,
  },
  C: {
    name: '流程图（n8n 式）',
    node: e => `<div class="node nC${e.lit ? '' : ' off'}${e.baseline ? ' base' : ''}" data-id="${e.id}" tabindex="0">
        <div class="box"><span class="nid">${e.id}</span>${e.lit ? `<span class="ok">${ico.check}</span>` : ''}
          <span class="port in" data-port="in:${e.id}"></span><span class="port out" data-port="out:${e.id}:_"></span><button class="plus" data-derive="${e.id}" title="从 ${e.id} 派生新实验">+</button></div>
        <div class="lab">${esc(e.title)}</div>
        <div class="sub tnum">${e.lit ? `AUC@10 ${pct(e.auc)}${e.n > 1 ? `，${e.n} 个方法` : ''}` : '未点亮'}</div>
        ${e.baseline ? '<span class="tagb">基线</span>' : ''}</div>`,
    note: n => `<div class="noteC" data-note="${n.id}"><b>便签</b>${esc(NOTES[n.id] || n.text)}</div>`,
    group: g => `<div class="gC ${g.c}" data-grp="${g.id}"><div class="gt">${esc(g.title)}</div></div>`,
    edge(a, b, e) {
      const x2 = b[0] - 8, dx = Math.max(50, Math.abs(x2 - a[0]) * .5), mx = a[0] + (x2 - a[0]) * .72, my = a[1] + (b[1] - a[1]) * .86;
      return { svg: `<path class="eC${e.lit ? '' : ' off'}" d="M${a[0] + 6},${a[1]} C${a[0] + dx},${a[1]} ${x2 - dx},${b[1]} ${x2},${b[1]}"/><path class="eCa${e.lit ? '' : ' off'}" d="M${x2 - 1},${b[1] - 5} L${b[0] - 1},${b[1]} L${x2 - 1},${b[1] + 5}z"/>`,
               html: e.init ? `<span class="lblC" style="left:${mx}px;top:${my}px">${e.init}</span>` : '' };
    },
    chrome: () => `<nav class="C-side"><span class="logo">M</span><button class="on" title="实验画布">${ico.grid}</button><button title="实验列表">${ico.list}</button><button title="设置" style="margin-top:auto;margin-bottom:12px">${ico.gear}</button></nav>
      <header class="C-head"><span class="bc"><span>moon-exp /</span> 实验画布</span><span class="seg"><span class="on">画布</span><span>列表</span></span><span class="sp"></span>
        <span class="cnt">${EXPS.length} 个实验，${litN()} 个已点亮</span><button class="ghost" data-tool="note">便签</button><button class="ghost" data-tool="group">分组框</button><button class="pri" data-tool="exp">新建实验</button></header>
      <div class="C-zoom"><button data-zoom="fit" aria-label="适应窗口">${ico.fit}</button><button data-zoom="1" aria-label="放大">+</button><button data-zoom="-1" aria-label="缩小">−</button><button class="pc" id="pc" data-zoom="reset"></button></div>`,
  },
};

// ---------------- 渲染 ----------------
const $ = s => document.querySelector(s);
const vp = $('#viewport'), world = $('#world'), layer = $('#layer'), edges = $('#edges'), labels = $('#labels');
function render() {
  const v = V[S.v], lay = L(); document.body.dataset.v = S.v;
  $('#chrome').innerHTML = v.chrome();
  layer.innerHTML = lay.groups.map(v.group).join('') + lay.notes.map(v.note).join('') + EXPS.map(v.node).join('');
  lay.groups.forEach(g => Object.assign(layer.querySelector(`[data-grp="${g.id}"]`).style, { left: g.x + 'px', top: g.y + 'px', width: g.w + 'px', height: g.h + 'px' }));
  lay.notes.forEach(n => Object.assign(layer.querySelector(`[data-note="${n.id}"]`).style, { left: n.x + 'px', top: n.y + 'px' }));
  EXPS.forEach(e => { const el = layer.querySelector(`[data-id="${e.id}"]`), [x, y] = lay.pos[e.id]; el.style.left = x + 'px'; el.style.top = y + 'px'; if (S.sel === e.id) el.classList.add('sel'); });
  applyView(); drawEdges(); swLabel();
}
function portXY(key) {
  const el = layer.querySelector(`[data-port="${key}"]`); if (!el) return null;
  const r = el.getBoundingClientRect(), w = world.getBoundingClientRect();
  return [(r.left + r.width / 2 - w.left) / S.k, (r.top + r.height / 2 - w.top) / S.k];
}
function drawEdges() {
  let svg = '', html = '';
  EXPS.filter(e => e.parent && byId[e.parent]).forEach(e => {
    const a = portXY(`out:${e.parent}:${e.init || '_'}`) || portXY(`out:${e.parent}:_`), b = portXY(`in:${e.id}`);
    const o = V[S.v].edge(a, b, e); svg += o.svg; html += o.html || '';
  });
  edges.innerHTML = svg; labels.innerHTML = html;
  if (S.v === 'A') drawMini();
}
function applyView() {
  world.style.transform = `translate(${S.tx}px,${S.ty}px) scale(${S.k})`;
  const g = (S.v === 'B' ? 22 : 20) * S.k;
  vp.style.backgroundSize = S.v === 'A' ? `${g}px ${g}px, ${g}px ${g}px, ${g * 5}px ${g * 5}px, ${g * 5}px ${g * 5}px` : `${g}px ${g}px`;
  vp.style.backgroundPosition = `${S.tx}px ${S.ty}px`;
  const pc = $('#pc'); if (pc) pc.textContent = Math.round(S.k * 100) + '%';
  if (S.v === 'A') drawMini();
}
function rects() {
  const w = world.getBoundingClientRect();
  return [...layer.children].map(el => { const r = el.getBoundingClientRect(); return { el, x: (r.left - w.left) / S.k, y: (r.top - w.top) / S.k, w: r.width / S.k, h: r.height / S.k }; });
}
function bounds() { const rs = rects(); return { x0: Math.min(...rs.map(r => r.x)), y0: Math.min(...rs.map(r => r.y)), x1: Math.max(...rs.map(r => r.x + r.w)), y1: Math.max(...rs.map(r => r.y + r.h)) }; }
function fit() {
  const b = bounds(), r = vp.getBoundingClientRect(), pad = 70;
  S.k = Math.min(1.1, Math.max(.3, Math.min((r.width - 2 * pad) / (b.x1 - b.x0), (r.height - 2 * pad) / (b.y1 - b.y0))));
  S.tx = (r.width - (b.x1 - b.x0) * S.k) / 2 - b.x0 * S.k; S.ty = (r.height - (b.y1 - b.y0) * S.k) / 2 - b.y0 * S.k; applyView();
}
function centerOn(id) {
  const el = layer.querySelector(`[data-id="${id}"]`), [x, y] = L().pos[id], r = vp.getBoundingClientRect(); S.k = 1;
  S.tx = r.width / 2 - (x + el.offsetWidth / 2); S.ty = r.height / 2 - (y + el.offsetHeight / 2); applyView();
}
function drawMini() {
  const svg = $('#mini'); if (!svg) return;
  const b = bounds(), W = 232, H = 130, s = Math.min(W / (b.x1 - b.x0 + 100), H / (b.y1 - b.y0 + 100));
  const X = x => (x - b.x0 + 50) * s, Y = y => (y - b.y0 + 50) * s, r = vp.getBoundingClientRect();
  svg.innerHTML = rects().map(o => {
    const e = o.el.dataset.id && byId[o.el.dataset.id];
    const fill = o.el.dataset.grp ? 'rgba(62,122,168,.25)' : o.el.dataset.note ? '#574F37' : e && e.lit ? '#4A6E96' : '#3A3C42';
    return `<rect x="${X(o.x)}" y="${Y(o.y)}" width="${o.w * s}" height="${o.h * s}" rx="1.5" fill="${fill}"/>`;
  }).join('') + `<rect x="${X(-S.tx / S.k)}" y="${Y(-S.ty / S.k)}" width="${r.width / S.k * s}" height="${r.height / S.k * s}" fill="rgba(255,255,255,.05)" stroke="#E4E5E8" stroke-width="1"/>`;
  svg.onclick = ev => { const p = svg.getBoundingClientRect(); const wx = (ev.clientX - p.left) / s + b.x0 - 50, wy = (ev.clientY - p.top) / s + b.y0 - 50;
    S.tx = r.width / 2 - wx * S.k; S.ty = r.height / 2 - wy * S.k; applyView(); };
}

// ---------------- 交互 ----------------
let drag = null;
const toWorld = (cx, cy) => { const r = vp.getBoundingClientRect(); return [(cx - r.left - S.tx) / S.k, (cy - r.top - S.ty) / S.k]; };
vp.addEventListener('pointerdown', ev => {
  if (ev.target.closest('[data-derive]')) return;
  const n = ev.target.closest('[data-id]'), nt = ev.target.closest('[data-note]'), g = ev.target.closest('[data-grp]');
  const [wx, wy] = toWorld(ev.clientX, ev.clientY), lay = L();
  if (n) { const p = lay.pos[n.dataset.id]; drag = { kind: 'node', id: n.dataset.id, ox: wx - p[0], oy: wy - p[1], moved: 0, sx: ev.clientX, sy: ev.clientY }; }
  else if (nt) { const o = lay.notes.find(x => x.id === nt.dataset.note); drag = { kind: 'note', o, ox: wx - o.x, oy: wy - o.y }; }
  else if (g && (S.v !== 'A' || ev.target.closest('.gt'))) {   // 分组框：几何包含的实验和便签一起移动（A 只能拖标题栏）
    const o = lay.groups.find(x => x.id === g.dataset.grp), rs = rects();
    const inside = r => r.x >= o.x && r.y >= o.y && r.x + r.w <= o.x + o.w && r.y + r.h <= o.y + o.h;
    drag = { kind: 'group', o, ox: wx - o.x, oy: wy - o.y,
      mem: rs.filter(r => r.el.dataset.id && inside(r)).map(r => [r.el.dataset.id, lay.pos[r.el.dataset.id][0] - o.x, lay.pos[r.el.dataset.id][1] - o.y]),
      nts: rs.filter(r => r.el.dataset.note && inside(r)).map(r => { const nn = lay.notes.find(x => x.id === r.el.dataset.note); return [nn, nn.x - o.x, nn.y - o.y]; }) };
  } else { drag = { kind: 'pan', sx: ev.clientX - S.tx, sy: ev.clientY - S.ty }; vp.classList.add('panning'); }
});
window.addEventListener('pointermove', ev => {
  if (!drag) return;
  const [wx, wy] = toWorld(ev.clientX, ev.clientY), lay = L();
  if (drag.kind === 'pan') { S.tx = ev.clientX - drag.sx; S.ty = ev.clientY - drag.sy; applyView(); return; }
  if (drag.kind === 'node') { drag.moved = Math.max(drag.moved, Math.hypot(ev.clientX - drag.sx, ev.clientY - drag.sy)); if (drag.moved < 4) return; lay.pos[drag.id] = [Math.round(wx - drag.ox), Math.round(wy - drag.oy)]; }
  else if (drag.kind === 'note') { drag.o.x = Math.round(wx - drag.ox); drag.o.y = Math.round(wy - drag.oy); }
  else { const o = drag.o; o.x = Math.round(wx - drag.ox); o.y = Math.round(wy - drag.oy);
    drag.mem.forEach(([id, dx, dy]) => lay.pos[id] = [o.x + dx, o.y + dy]); drag.nts.forEach(([nn, dx, dy]) => { nn.x = o.x + dx; nn.y = o.y + dy; }); }
  render();
});
window.addEventListener('pointerup', () => { if (drag && drag.kind === 'node' && drag.moved < 4) open(drag.id); drag = null; vp.classList.remove('panning'); });
vp.addEventListener('wheel', ev => {
  ev.preventDefault(); const r = vp.getBoundingClientRect(), mx = ev.clientX - r.left, my = ev.clientY - r.top;
  const k = Math.min(2, Math.max(.3, S.k * Math.exp(-ev.deltaY * .0015)));
  S.tx = mx - (mx - S.tx) * k / S.k; S.ty = my - (my - S.ty) * k / S.k; S.k = k; applyView();
}, { passive: false });
vp.addEventListener('keydown', ev => { if (ev.key === 'Enter' && ev.target.dataset.id) open(ev.target.dataset.id); });
vp.addEventListener('click', ev => { const d = ev.target.closest('[data-derive]'); if (d) toast(`原型：会新建一个未点亮实验，parent = ${d.dataset.derive}，并连好线。`); });

function open(id) {
  S.sel = id;
  if (byId[id].page && R[id]) { location.href = `../prototype-node-page/index.html?exp=${id}&canvas=${S.v}`; return; }
  render(); toast(`原型：${id} 是模拟实验，没有节点页数据。有节点页的是 B0、B0m、E1、E2。`);
}
$('#chrome').addEventListener('click', ev => {
  const z = ev.target.closest('[data-zoom]'), t = ev.target.closest('[data-tool]');
  if (z) { const d = z.dataset.zoom; if (d === 'fit') fit(); else { const r = vp.getBoundingClientRect(), k = d === 'reset' ? 1 : Math.min(2, Math.max(.3, S.k * (d > 0 ? 1.2 : 1 / 1.2)));
    S.tx = r.width / 2 - (r.width / 2 - S.tx) * k / S.k; S.ty = r.height / 2 - (r.height / 2 - S.ty) * k / S.k; S.k = k; applyView(); } }
  if (t) {
    const r = vp.getBoundingClientRect(), [cx, cy] = toWorld(r.left + r.width / 2, r.top + r.height / 2), lay = L();
    if (t.dataset.tool === 'exp') {
      const id = 'E' + (1 + Math.max(...EXPS.map(e => +e.id.slice(1) || 0))), e = { id, title: '（未命名）', parent: '', lit: false, page: false };
      EXPS.push(e); byId[id] = e; Object.values(S.L).forEach(l => l.pos[id] = [Math.round(cx - 120), Math.round(cy - 60)]);
      toast(`原型：已在内存里建出 ${id}。实际会写出 runs/${id}/exp.toml。`);
    } else if (t.dataset.tool === 'note') { lay.notes.push({ id: 'n' + Date.now(), x: Math.round(cx - 110), y: Math.round(cy - 30), text: '新便签' }); }
    else { lay.groups.push({ id: 'g' + Date.now(), c: 'c3', x: Math.round(cx - 220), y: Math.round(cy - 140), w: 440, h: 280, title: '新分组' }); }
    render();
  }
});
let tt; function toast(s) { const t = $('#toast'); t.textContent = s; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 3400); }

// ---------------- 原型切换条 ----------------
const KEYS = ['A', 'B', 'C'];
function swLabel() { $('#swlab').innerHTML = `${S.v}　${V[S.v].name}<small>原型控件：← → 切换，单击实验进入节点页</small>`; }
function go(d) {
  S.v = KEYS[(KEYS.indexOf(S.v) + d + KEYS.length) % KEYS.length];
  const u = new URL(location); u.searchParams.set('variant', S.v); u.searchParams.delete('focus'); history.replaceState(null, '', u);
  render(); fit();
}
$('#prev').onclick = () => go(-1); $('#next').onclick = () => go(1);
window.addEventListener('keydown', ev => { if (ev.target.closest('input, textarea, [contenteditable]')) return; if (ev.key === 'ArrowLeft') go(-1); if (ev.key === 'ArrowRight') go(1); });

// ---------------- 启动：?variant=；从节点页返回时 ?focus=<id> 居中并选中 ----------------
const q = new URLSearchParams(location.search);
S.v = KEYS.includes(q.get('variant')) ? q.get('variant') : 'A';
const focus = byId[q.get('focus')] ? q.get('focus') : null;
if (focus) S.sel = focus;
function settle() { render(); if (focus) centerOn(focus); else fit(); drawEdges(); }
settle();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(settle);
window.addEventListener('load', () => drawEdges());
window.addEventListener('resize', () => applyView());
</script>
</body>
