<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>实验工作台 · moon-exp</title>
<style>
  :root { --ink:#1f2328; --mute:#656d76; --line:#d0d7de; --bg:#f6f8fa; --acc:#0969da; --good:#1a7f37; --bad:#cf222e; --warn:#9a6700; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.55 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif; color:var(--ink); background:#fff; }
  h1,h2,h3,h4 { margin:.2em 0 .5em; line-height:1.3; }
  h2 { font-size:18px; } h3 { font-size:15px; } h4 { font-size:13px; color:var(--mute); letter-spacing:.04em; margin-top:14px; }
  a { color:var(--acc); text-decoration:none; cursor:pointer; } a:hover { text-decoration:underline; }
  code, .mono { font-family:Consolas,"SFMono-Regular",monospace; font-size:12.5px; }
  table { border-collapse:collapse; }
  th, td { padding:4px 8px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap; }
  th:first-child, td:first-child { text-align:left; }
  th { font-weight:600; color:var(--mute); font-size:12px; background:var(--bg); }
  tr.click:hover td { background:#eef4ff; cursor:pointer; }
  tr.on td { background:#ddf4ff; }
  .pill { display:inline-block; padding:0 7px; border-radius:10px; font-size:11.5px; border:1px solid var(--line); background:#fff; color:var(--mute); }
  .pill.kept { color:var(--good); border-color:#9bd3a8; background:#eefbf1; }
  .pill.dropped { color:var(--bad); border-color:#f3b0b5; background:#fff1f1; }
  .pill.running { color:var(--warn); border-color:#e6cf85; background:#fff8e1; }
  .pill.baseline { color:#6639ba; border-color:#cdb8f5; background:#f6f1ff; }
  .up { color:var(--good); } .down { color:var(--bad); } .muted { color:var(--mute); }
  .topbar { display:flex; align-items:center; gap:14px; padding:6px 16px; border-bottom:1px solid var(--line); background:var(--bg); font-size:12.5px; height:34px; }
  .topbar button { font:inherit; font-size:12px; border:1px solid var(--line); background:#fff; border-radius:6px; padding:1px 10px; cursor:pointer; }
  .warnbox { color:#6b5300; background:#fff8c5; border:1px solid #e6d27a; border-radius:6px; padding:0 8px; }
  .card { border:1px solid var(--line); border-radius:8px; padding:10px 12px; background:#fff; }
  .diff { background:#0d1117; color:#c9d1d9; border-radius:6px; padding:8px 10px; font-family:Consolas,monospace; font-size:12px; white-space:pre; overflow:auto; }
  .legend { display:flex; gap:10px; flex-wrap:wrap; font-size:12px; color:var(--mute); }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:4px; vertical-align:-1px; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .seg button { border:0; background:#fff; padding:2px 10px; cursor:pointer; font:inherit; font-size:12px; }
  .seg button.on { background:var(--ink); color:#fff; }
  svg text { font-family:inherit; }
  .main { display:grid; grid-template-columns:1fr 720px; height:calc(100vh - 34px); }
  .canvas { position:relative; overflow:auto; padding:12px 18px; background:radial-gradient(circle, #d8dee4 1px, transparent 1px) 0 0/18px 18px; }
  .panel { border-left:1px solid var(--line); overflow:auto; padding:16px 20px 80px; background:#fff; }
  .node { cursor:pointer; } .node rect { stroke-width:1.5; } .node.sel rect { stroke:#0969da; stroke-width:3; }
  .zone { margin:22px 0 8px; padding:5px 10px; background:var(--bg); border-left:3px solid var(--ink); font-weight:600; }
  .ctl { display:flex; gap:14px; flex-wrap:wrap; align-items:center; font-size:12.5px; margin:4px 0 6px; }
  .ctl select, .ctl input { font:inherit; font-size:12.5px; border:1px solid var(--line); border-radius:6px; padding:2px 6px; }
  .ctl input { width:150px; }
  .ctl button { font:inherit; font-size:12px; border:1px solid var(--line); background:#fff; border-radius:6px; padding:2px 10px; cursor:pointer; }
  .chips { display:flex; gap:6px; margin:6px 0 10px; flex-wrap:wrap; align-items:center; }
  .chip { border:1px solid var(--line); border-radius:14px; padding:2px 10px; font-size:12px; cursor:pointer; background:#fff; }
  .vcard { border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin-bottom:10px; }
  .vcard.hl { border-color:#0969da; box-shadow:0 0 0 2px #cfe3ff; }
  .imgs { display:flex; gap:6px; flex-wrap:wrap; }
  figure { margin:0; font-size:11px; color:var(--mute); text-align:center; }
  figure canvas { display:block; border-radius:4px; background:#222; }
  .scat circle { cursor:pointer; }
  .prose { white-space:pre-wrap; margin:0 0 6px; }
  .extra img { max-width:100%; } .extra iframe { width:100%; height:420px; border:1px solid var(--line); border-radius:6px; }
  .extra pre { white-space:pre-wrap; background:var(--bg); padding:8px; border-radius:6px; font-size:12px; max-height:400px; overflow:auto; }
</style>
</head>
<body>
<div id="app"><p style="padding:20px" class="muted">加载中…</p></div>
<script src="/static/app.js"></script>
</body>
</html>
