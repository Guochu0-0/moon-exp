# E43（#250）：E41 `main` 原样（_e41：E37 五级配置 + 参照内点比例门槛 0.15 的样本筛选），只多一项遮挡约束奖励（逐像素）：
# 每对图另生成 1 个遮挡版本（光学图上 229 px 正方形、SAR 上为它经参照仿射映射的四边形，填全图均值、标准差的高斯噪声），
# 当前模型在遮挡版本上抽签，按离EMA 参照在原图上各级逐像素对应的距离打分。系数 1.7 = 定系数运行（_probe，code/probe.py）
# 前 50 次更新两项在共用参数上梯度范数之比的中位数 1.67（四分位 1.43–1.96，extra/data/probe.json）取 2 位有效数字。
# 每 10 次调用记一次两项梯度范数之比。种子 0，7907 次更新。
base = "_e41"

[rloo]
pix_occ = true
pix_occ_w = 1.7
pix_occ_gn_every = 10
