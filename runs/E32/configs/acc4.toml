# 每步 4 对：4 对累积一次参数更新（accum = 4）。步数、学习率调度、存档、提前停的窗口按前向步计，所以都乘 4：
# 16000 前向步 = 4000 次更新的调度（warmup 2000 前向步 = 500 次更新），训到第 8000 前向步（2000 次更新），每 2000 前向步
# （500 次更新）存档，提前停的窗口 200 个记录（50 次更新）。
base = "_e32"

[optim]
accum = 4
steps = 16000
warmup = 2000

[run]
stop_at = 8000
save_every = 2000
halt_window = 200
