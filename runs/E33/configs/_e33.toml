# E33（#226）底座：E32 `ema` 原样（runs/E32/configs/_e32.toml 与 ema.toml 合并：E28 `fm` 的粗匹配 + 细化尺度 16、8、4 逐级抽签，
# w_f = 4.2，画面外处理，细化学习率 1.4e-5、VGG 放开，难版扰动，DINOv2 qkv LoRA r 8，lr 3e-5（LoRA 1e-4），
# EMA 参照 τ = 0.999），改两处：
# - warmup 之后学习率恒定（sched = "const"），不再余弦下降；
# - 训 2 遍训练集（7907 对 × 2 = 15814 对），每 1000 对存档；只评 Val（评测由 code/eval_queue.py 做，不评 Test）；
# - 单卡提速不用：SDPA 没有通过梯度核对（见 Notes），其余提速办法按用户决定不试。
# 提前停照 E32：离参照距离的 50 次更新滑动中位数 > 100 px，或画面内格子比例的滑动中位数 < 0.5。种子 0。
[model]
name = "roma"
lora_r = 8
train_vgg = true
refine_lr = 0.47
vgg_lr = 0.47

[optim]
lr = 3e-5
steps = 15814
warmup = 500
sched = "const"

[aug]
shift = 128.0
shift_disk = true
rot = 20.0
scale = 0.2
photo = false
erase = true

[rloo]
reward = "ref"
baseline = "loo"
temp = 0.3
shape = "gauss"
delta = 8.0
frame_mask = true
cert_bce = 0.01
fine_shape = "cauchy"
levels = [16, 8, 4]
k = 0.5
fine_mode = "local"
fine_group = 8
fine_mask = true
fine_cert_bce = 0.01
fine_w = 4.2
ref_ema = 0.999

[run]
seed = 0
save_every = 1000
save_zero = false
sweep = "last"
halt_above = {d_ref = 100.0}
halt_below = {in_frame = 0.5}
halt_window = 50
