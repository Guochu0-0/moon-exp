<!doctype html>
<!-- PROTOTYPE（一次性）：「视觉方向」#21，第三版。用户选定 ComfyUI 式（第二版的 A），本版只迭代它：
     去掉左侧图标栏和标签栏；右键菜单、快捷键、从端口拖线改父 / 派生；分组框可调大小；双击改分组标题和便签。
     第二版的 B（Krea 式）、C（n8n 式）在上一个 commit 里。双击打开即可。B0 / B0m 为真实结果（../prototype-node-page/data.js），
     E1–E5 为模拟实验。所有改动只在内存里，刷新即丢。别合进 main。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>实验画布（原型 v3）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
<script src="../prototype-node-page/data.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; overflow: hidden; background: #17181B; color: #E4E5E8; font: 13px/1.45 "IBM Plex Sans", "Noto Sans SC", sans-serif; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid #4C8DF6; outline-offset: 2px; }
  .mono { font-family: "IBM Plex Mono", monospace; }
  svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

  #viewport { position: fixed; inset: 0; overflow: hidden; cursor: default; touch-action: none;
    background-color: #17181B;
    background-image: linear-gradient(#202125 1px, transparent 1px), linear-gradient(90deg, #202125 1px, transparent 1px),
                      linear-gradient(#1B1C1F 1px, transparent 1px), linear-gradient(90deg, #1B1C1F 1px, transparent 1px); }
  #viewport.panning { cursor: grabbing; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #edges { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }
  #layer > * { position: absolute; }
  #layer > [data-grp] { z-index: -1; }

  /* 外框：左上标题、右上操作、右下小地图、左下快捷键 */
  .title { position: fixed; left: 14px; top: 12px; z-index: 5; display: flex; align-items: baseline; gap: 12px; padding: 7px 14px; background: #1E1F23; border: 1px solid #2E3035; border-radius: 10px; }
  .title b { font-weight: 600; font-size: 14px; }
  .title span { color: #8B8D94; font-size: 12px; }
  .act { position: fixed; top: 12px; right: 14px; z-index: 5; display: flex; gap: 6px; padding: 5px; background: #1E1F23; border: 1px solid #2E3035; border-radius: 10px; }
  .act button { border: 0; background: #2A2C31; border-radius: 6px; padding: 5px 12px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
  .act button:hover { background: #33363C; }
  .act .pri { background: #2A7FDB; color: #fff; } .act .pri:hover { background: #3A8DEA; }
  .act .pc { padding: 5px 4px; min-width: 44px; text-align: center; color: #A3A5AC; font: 12px/1.8 "IBM Plex Mono", monospace; }
  .act kbd, .menu kbd, .keys kbd { font: 11px "IBM Plex Mono", monospace; color: #8B8D94; }
  .mini { position: fixed; right: 14px; bottom: 14px; z-index: 5; width: 232px; background: #1E1F23; border: 1px solid #2E3035; border-radius: 10px; overflow: hidden; }
  .mini svg { display: block; cursor: pointer; }
  .keysbtn { position: fixed; left: 14px; bottom: 14px; z-index: 5; border: 1px solid #2E3035; background: #1E1F23; border-radius: 8px; padding: 5px 11px; color: #A3A5AC; font-size: 12.5px; }
  .keysbtn:hover { color: #E4E5E8; }
  .keys { position: fixed; left: 14px; bottom: 52px; z-index: 6; width: 300px; background: #1E1F23; border: 1px solid #2E3035; border-radius: 10px; padding: 10px 14px; box-shadow: 0 10px 30px rgba(0,0,0,.45); display: none; }
  .keys.on { display: block; }
  .keys h3 { margin: 0 0 6px; font-size: 13px; font-weight: 600; }
  .keys dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 12.5px; }
  .keys dt { text-align: right; } .keys dd { margin: 0; color: #C9CBD0; }
  .keys dt kbd { display: inline-block; border: 1px solid #3A3C42; border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: #E4E5E8; }

  /* 实验节点 */
  .nA { width: 300px; background: #26272B; border: 1px solid #3A3C42; border-radius: 10px; box-shadow: 0 6px 18px rgba(0,0,0,.35); user-select: none; cursor: pointer; }
  .nA .hdr { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; background: #1D1E21; border-radius: 10px 10px 0 0; border-bottom: 1px solid #333539; }
  .nA .nid { font: 600 13px "IBM Plex Mono", monospace; }
  .nA .ttl { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: #B7B9BF; }
  .nA .chip { font-size: 11px; color: #C9B27C; border: 1px solid #5A4E33; border-radius: 4px; padding: 0 5px; }
  .nA .st { width: 8px; height: 8px; border-radius: 50%; background: #4FB47E; box-shadow: 0 0 0 3px rgba(79,180,126,.18); flex: none; }
  .nA.off .st { background: none; border: 1.5px solid #6B6E76; box-shadow: none; }
  .nA .io { position: relative; display: flex; justify-content: space-between; padding: 7px 14px 5px; font-size: 11.5px; color: #8B8D94; }
  .nA .row { position: relative; display: grid; grid-template-columns: 1fr 104px; gap: 10px; align-items: center; padding: 3px 14px; }
  .nA .mn { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: #C9CBD0; font: 12px "IBM Plex Mono", monospace; }
  .nA .bar { position: relative; height: 20px; border-radius: 5px; background: #1B1C1F; overflow: hidden; }
  .nA .bar i { position: absolute; inset: 0 auto 0 0; background: #35506F; }
  .nA .bar span { position: relative; display: block; text-align: right; padding-right: 7px; font: 11.5px/20px "IBM Plex Mono", monospace; color: #E4E5E8; }
  .nA .more { padding: 4px 14px 9px; font-size: 11.5px; color: #8B8D94; }
  .nA .empty { margin: 4px 14px 12px; height: 46px; border: 1px dashed #45474E; border-radius: 6px; display: grid; place-items: center; color: #8B8D94; font-size: 12px; }
  .nA .port { position: absolute; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #26272B; top: 50%; margin-top: -6px; }
  .nA .port.in { left: -6px; background: #9A9CA3; }
  .nA .port.out { right: -6px; cursor: crosshair; }
  .nA .port.out:hover { transform: scale(1.35); }
  .nA .io .port.out { background: #9A9CA3; }
  .fam-roma { background: #64A8F5; } .fam-loftr { background: #F0B541; } .fam-other { background: #B79EE0; } .fam-none { background: #9A9CA3; }
  .nA.off { background: #1F2023; border-style: dashed; border-color: #3A3C42; }
  .nA.off .hdr { background: #1B1C1F; } .nA.off .nid, .nA.off .ttl { color: #8B8D94; }
  .nA:hover { border-color: #5A5D65; }
  .nA.sel { border-color: #fff; box-shadow: 0 0 0 1px #fff, 0 6px 18px rgba(0,0,0,.35); opacity: 1; }
  .nA.drop { border-color: #64A8F5; box-shadow: 0 0 0 2px #64A8F5; opacity: 1; }
  .nA.new { animation: pop .35s ease-out; }
  @keyframes pop { from { transform: scale(.94); opacity: 0; } }

  /* 分组框 */
  .gA { border-radius: 6px; user-select: none; }
  .gA .gt { position: absolute; left: 0; right: 0; top: 0; height: 34px; padding: 0 12px; font-size: 16px; font-weight: 500; line-height: 34px; border-radius: 6px 6px 0 0; cursor: move; white-space: nowrap; overflow: hidden; }
  .gA .gt[contenteditable=true] { cursor: text; outline: 1px solid rgba(255,255,255,.5); user-select: text; }
  .gA .rz { position: absolute; right: 0; bottom: 0; width: 18px; height: 18px; cursor: nwse-resize; }
  .gA .rz::after { content: ""; position: absolute; right: 3px; bottom: 3px; border-style: solid; border-width: 0 0 11px 11px; border-color: transparent transparent rgba(255,255,255,.35) transparent; }
  .gA .rz:hover::after { border-bottom-color: rgba(255,255,255,.7); }
  .gA.c1 { background: rgba(62,122,168,.16); border: 1px solid rgba(62,122,168,.45); } .gA.c1 .gt { background: rgba(62,122,168,.42); }
  .gA.c2 { background: rgba(160,110,56,.14); border: 1px solid rgba(160,110,56,.45); } .gA.c2 .gt { background: rgba(160,110,56,.40); }
  .gA.c3 { background: rgba(110,140,90,.14); border: 1px solid rgba(110,140,90,.45); } .gA.c3 .gt { background: rgba(110,140,90,.40); }
  .gA.c4 { background: rgba(140,90,150,.14); border: 1px solid rgba(140,90,150,.45); } .gA.c4 .gt { background: rgba(140,90,150,.40); }

  /* 便签 */
  .noteA { width: 230px; background: #3A3526; border: 1px solid #574F37; border-radius: 10px; overflow: hidden; cursor: move; user-select: none; }
  .noteA .hdr { height: 30px; padding: 0 10px; line-height: 30px; background: #2E2A1F; color: #D9C99A; font-size: 12.5px; }
  .noteA .body { padding: 8px 12px 10px; color: #E9E1C9; font-size: 13px; min-height: 2.4em; white-space: pre-wrap; }
  .noteA .body[contenteditable=true] { cursor: text; outline: 1px solid #8C7A48; user-select: text; }

  .eA { fill: none; stroke-width: 2.6; }
  .eA.fam-roma { stroke: #64A8F5; } .eA.fam-loftr { stroke: #F0B541; } .eA.fam-other { stroke: #B79EE0; } .eA.fam-none { stroke: #9A9CA3; }
  .eA.off { opacity: .5; }
  .eA.tmp { stroke-dasharray: 6 5; opacity: .9; }

  /* 右键菜单 */
  .menu { position: fixed; z-index: 40; min-width: 210px; background: #1E1F23; border: 1px solid #3A3C42; border-radius: 8px; padding: 4px; box-shadow: 0 10px 30px rgba(0,0,0,.5); font-size: 13px; }
  .menu .h { padding: 4px 10px 5px; color: #8B8D94; font-size: 11.5px; border-bottom: 1px solid #2E3035; margin-bottom: 3px; }
  .menu button { display: flex; width: 100%; justify-content: space-between; gap: 18px; border: 0; background: none; text-align: left; padding: 5px 10px; border-radius: 5px; }
  .menu button:hover:not(:disabled) { background: #2A7FDB; color: #fff; } .menu button:hover:not(:disabled) kbd { color: #DDE9FA; }
  .menu button:disabled { color: #5E6168; cursor: not-allowed; }
  .menu hr { border: 0; border-top: 1px solid #2E3035; margin: 3px 0; }
  .toast { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); z-index: 50; background: #2A2C31; border: 1px solid #3A3C42; color: #E4E5E8; font-size: 12.5px; padding: 6px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 640px; }
  .toast.on { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } .nA.new { animation: none; } }
</style>
</head>
<body>
<div id="viewport"><div id="world"><svg id="edges"></svg><div id="layer"></div></div></div>
<div class="title"><b>实验画布</b><span id="count"></span></div>
<div class="act">
  <button class="pri" data-cmd="exp"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>新建实验 <kbd>E</kbd></button>
  <button data-cmd="note">便签 <kbd>N</kbd></button><button data-cmd="group">分组框 <kbd>G</kbd></button>
  <button data-cmd="zout" aria-label="缩小">−</button><span class="pc" id="pc"></span><button data-cmd="zin" aria-label="放大">+</button>
  <button data-cmd="fit" title="适应窗口（.）" aria-label="适应窗口"><svg class="i" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>
<div class="mini"><svg id="mini" width="232" height="130" aria-label="小地图"></svg></div>
<button class="keysbtn" id="keysbtn">快捷键 <kbd>?</kbd></button>
<div class="keys" id="keys"><h3>快捷键与鼠标</h3><dl>
  <dt>右键</dt><dd>上下文菜单：空白处新建，实验 / 方法行 / 分组 / 便签上各有操作</dd>
  <dt>双击空白</dt><dd>在此处新建实验</dd>
  <dt><kbd>E</kbd></dt><dd>在鼠标处新建实验</dd>
  <dt><kbd>N</kbd></dt><dd>在鼠标处新建便签</dd>
  <dt><kbd>G</kbd></dt><dd>在鼠标处新建分组框</dd>
  <dt><kbd>.</kbd></dt><dd>适应窗口</dd>
  <dt><kbd>+</kbd> <kbd>−</kbd></dt><dd>放大 / 缩小（滚轮也可以）</dd>
  <dt><kbd>Del</kbd></dt><dd>删除鼠标下的未点亮实验、便签或分组框</dd>
  <dt><kbd>Esc</kbd></dt><dd>关闭菜单 / 取消拖线</dd>
  <dt>拖空白</dt><dd>平移画布</dd>
  <dt>从端口拖线</dt><dd>拖到实验上：改它的父实验；拖到空白：派生新实验</dd>
  <dt>分组右下角</dt><dd>拖动调整大小；拖标题栏移动整组</dd>
  <dt>双击标题 / 便签</dt><dd>重命名分组、编辑便签</dd>
  <dt>单击实验</dt><dd>进入节点页</dd>
</dl></div>
<div class="toast" id="toast"></div>
<script>
// ---------------- 数据 ----------------
const R = (window.DATA || { runs: {} }).runs, MAIN = 'auc@10';
const methodsOf = ms => Object.entries(ms).filter(([, s]) => s.val).map(([m, s]) => ({ m, auc: s.val.summary[MAIN] })).sort((a, b) => (b.auc ?? -1) - (a.auc ?? -1));
const fam = m => !m ? 'none' : /roma/i.test(m) ? 'roma' : /loftr/i.test(m) ? 'loftr' : 'other';
const real = id => { const r = R[id]; return { id, title: r.meta.title, parent: r.meta.parent || '', init: (r.meta.init || '').split('/')[1] || '', lit: true, baseline: !!r.meta.baseline, methods: methodsOf(r.metrics), page: true }; };
const e3v = R.B0m?.metrics['anymatch_loftr__zscore_2p5']?.val;
let EXPS = [
  real('B0'), real('B0m'),
  { ...real('E1'), methods: [{ m: 'anymatch_roma', auc: R.E1.metrics.main.val.summary[MAIN] }] },
  { id: 'E2', title: R.E2?.meta.title || 'SAR 先去斑再匹配', parent: 'E1', lit: false, page: true },
  { id: 'E3', title: 'AnyMatch-LoFTR 微调：逐匹配 reward', parent: 'B0', init: 'anymatch_loftr', lit: true, page: false, methods: [{ m: 'anymatch_loftr', auc: e3v?.summary[MAIN] }] },
  { id: 'E4', title: '加整对 reward：warp 后跨模态结构相似度', parent: 'E3', lit: false, page: false },
  { id: 'E5', title: 'minmax 输入映射下重做自训练', parent: 'B0m', init: 'anymatch_roma__minmax', lit: false, page: false },
];
EXPS.forEach(e => { if (e.methods) e.n = e.methods.length; });
const byId = id => EXPS.find(e => e.id === id);
// runs/canvas.json 的内容
const C = {
  pos: { B0: [60, 50], B0m: [480, 50], E5: [900, 50], E1: [480, 350], E2: [900, 350], E3: [480, 640], E4: [900, 640] },
  groups: [{ id: 'g1', c: 'c1', x: 30, y: -10, w: 780, h: 290, title: '零样本基线' }, { id: 'g2', c: 'c2', x: 450, y: 580, w: 780, h: 200, title: 'AnyMatch-LoFTR 微调' }],
  notes: [{ id: 'n1', x: 60, y: 350, text: 'Test 只在定稿时跑，平时只看 Val。' }, { id: 'n2', x: 1270, y: 640, text: '先看 3 px 下的失败是整体偏移还是随机噪声，再决定 E4 要不要做。' }],
};
const S = { tx: 0, ty: 0, k: 1, sel: null, mouse: [0, 0], link: null, fresh: null };

const pct = x => x == null ? '—' : (x * 100).toFixed(1);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const kids = id => EXPS.filter(e => e.parent === id);
const ancestors = id => { const out = []; let e = byId(id); while (e) { out.push(e.id); e = byId(e.parent); } return out; };
const nextId = () => 'E' + (1 + Math.max(...EXPS.map(e => +e.id.slice(1) || 0)));

// ---------------- 渲染 ----------------
function nodeHTML(e) {
  let rows = '';
  if (e.lit) {
    const show = e.methods.slice(0, 4);   // 被子实验用作 init 的方法总是显示，好接线
    kids(e.id).forEach(c => { if (c.init && !show.some(x => x.m === c.init)) { const m = e.methods.find(x => x.m === c.init); if (m) show.push(m); } });
    rows = show.map(x => `<div class="row" data-method="${x.m}"><span class="mn" title="${x.m}">${e.n > 1 ? x.m : '本实验'}</span>
        <div class="bar"><i style="width:${(x.auc || 0) * 100}%"></i><span>${pct(x.auc)}</span></div>
        <span class="port out fam-${fam(x.m)}" data-port="out:${e.id}:${x.m}" title="从 ${x.m} 拖出：派生或改父"></span></div>`).join('')
      + (e.n > show.length ? `<div class="more">▸ 另外 ${e.n - show.length} 个方法</div>` : '');
  }
  return `<div class="nA${e.lit ? '' : ' off'}${S.sel === e.id ? ' sel' : ''}${S.fresh === e.id ? ' new' : ''}" data-id="${e.id}" tabindex="0">
    <div class="hdr"><span class="nid">${e.id}</span><span class="ttl" title="${esc(e.title)}">${esc(e.title)}</span>${e.baseline ? '<span class="chip">基线</span>' : ''}<span class="st" title="${e.lit ? '已点亮' : '未点亮'}"></span></div>
    <div class="io"><span class="port in" data-port="in:${e.id}"></span><span>父实验</span><span>${e.lit ? 'AUC@10（Val）' : ''}</span><span>子实验</span><span class="port out fam-none" data-port="out:${e.id}:_" title="拖出：派生或改父"></span></div>
    ${e.lit ? rows : '<div class="empty">尚无结果</div>'}</div>`;
}
const $ = s => document.querySelector(s);
const vp = $('#viewport'), world = $('#world'), layer = $('#layer'), edges = $('#edges');
function render() {
  layer.innerHTML = C.groups.map(g => `<div class="gA ${g.c}" data-grp="${g.id}" style="left:${g.x}px;top:${g.y}px;width:${g.w}px;height:${g.h}px"><div class="gt">${esc(g.title)}</div><span class="rz" title="拖动调整大小"></span></div>`).join('')
    + C.notes.map(n => `<div class="noteA" data-note="${n.id}" style="left:${n.x}px;top:${n.y}px"><div class="hdr">便签</div><div class="body">${esc(n.text)}</div></div>`).join('')
    + EXPS.map(nodeHTML).join('');
  EXPS.forEach(e => { const el = layer.querySelector(`[data-id="${e.id}"]`), [x, y] = C.pos[e.id]; el.style.left = x + 'px'; el.style.top = y + 'px'; });
  S.fresh = null;
  $('#count').textContent = `${EXPS.length} 个实验，${EXPS.filter(e => e.lit).length} 个已点亮`;
  applyView(); drawEdges();
}
function portXY(key) {
  const el = layer.querySelector(`[data-port="${key}"]`); if (!el) return null;
  const r = el.getBoundingClientRect(), w = world.getBoundingClientRect();
  return [(r.left + r.width / 2 - w.left) / S.k, (r.top + r.height / 2 - w.top) / S.k];
}
const curve = (a, b) => { const dx = Math.max(60, Math.abs(b[0] - a[0]) * .45); return `M${a[0]},${a[1]} C${a[0] + dx},${a[1]} ${b[0] - dx},${b[1]} ${b[0]},${b[1]}`; };
function drawEdges() {
  let svg = EXPS.filter(e => e.parent && byId(e.parent)).map(e => {
    const a = portXY(`out:${e.parent}:${e.init || '_'}`) || portXY(`out:${e.parent}:_`), b = portXY(`in:${e.id}`);
    return `<path class="eA fam-${fam(e.init)}${e.lit ? '' : ' off'}" d="${curve(a, b)}"/>`;
  }).join('');
  if (S.link) svg += `<path class="eA tmp fam-${fam(S.link.m === '_' ? '' : S.link.m)}" d="${curve(S.link.a, S.link.b)}"/>`;
  edges.innerHTML = svg; drawMini();
}
function applyView() {
  world.style.transform = `translate(${S.tx}px,${S.ty}px) scale(${S.k})`;
  const g = 20 * S.k;
  vp.style.backgroundSize = `${g}px ${g}px, ${g}px ${g}px, ${g * 5}px ${g * 5}px, ${g * 5}px ${g * 5}px`;
  vp.style.backgroundPosition = `${S.tx}px ${S.ty}px`;
  $('#pc').textContent = Math.round(S.k * 100) + '%';
  drawMini();
}
function rects() {
  const w = world.getBoundingClientRect();
  return [...layer.children].map(el => { const r = el.getBoundingClientRect(); return { el, x: (r.left - w.left) / S.k, y: (r.top - w.top) / S.k, w: r.width / S.k, h: r.height / S.k }; });
}
function bounds() { const rs = rects(); return { x0: Math.min(...rs.map(r => r.x)), y0: Math.min(...rs.map(r => r.y)), x1: Math.max(...rs.map(r => r.x + r.w)), y1: Math.max(...rs.map(r => r.y + r.h)) }; }
function fit() {
  const b = bounds(), r = vp.getBoundingClientRect(), pad = 80;
  S.k = Math.min(1.1, Math.max(.3, Math.min((r.width - 2 * pad) / (b.x1 - b.x0), (r.height - 2 * pad) / (b.y1 - b.y0))));
  S.tx = (r.width - (b.x1 - b.x0) * S.k) / 2 - b.x0 * S.k; S.ty = (r.height - (b.y1 - b.y0) * S.k) / 2 - b.y0 * S.k; applyView();
}
function zoomAt(k, mx, my) { k = Math.min(2, Math.max(.3, k)); S.tx = mx - (mx - S.tx) * k / S.k; S.ty = my - (my - S.ty) * k / S.k; S.k = k; applyView(); }
function centerOn(id) {
  const el = layer.querySelector(`[data-id="${id}"]`), [x, y] = C.pos[id], r = vp.getBoundingClientRect(); S.k = 1;
  S.tx = r.width / 2 - (x + el.offsetWidth / 2); S.ty = r.height / 2 - (y + el.offsetHeight / 2); applyView();
}
function drawMini() {
  const svg = $('#mini'); if (!layer.children.length) return;
  const b = bounds(), W = 232, H = 130, s = Math.min(W / (b.x1 - b.x0 + 100), H / (b.y1 - b.y0 + 100));
  const X = x => (x - b.x0 + 50) * s, Y = y => (y - b.y0 + 50) * s, r = vp.getBoundingClientRect();
  svg.innerHTML = rects().map(o => {
    const e = o.el.dataset.id && byId(o.el.dataset.id);
    const fill = o.el.dataset.grp ? 'rgba(62,122,168,.25)' : o.el.dataset.note ? '#574F37' : e && e.lit ? '#4A6E96' : '#3A3C42';
    return `<rect x="${X(o.x)}" y="${Y(o.y)}" width="${o.w * s}" height="${o.h * s}" rx="1.5" fill="${fill}"/>`;
  }).join('') + `<rect x="${X(-S.tx / S.k)}" y="${Y(-S.ty / S.k)}" width="${r.width / S.k * s}" height="${r.height / S.k * s}" fill="rgba(255,255,255,.05)" stroke="#E4E5E8"/>`;
  svg.onclick = ev => { const p = svg.getBoundingClientRect(); const wx = (ev.clientX - p.left) / s + b.x0 - 50, wy = (ev.clientY - p.top) / s + b.y0 - 50;
    S.tx = r.width / 2 - wx * S.k; S.ty = r.height / 2 - wy * S.k; applyView(); };
}

// ---------------- 操作（真实实现里对应写 exp.toml / canvas.json） ----------------
function freeSpot(x, y) {   // 从 (x, y) 往下找不与现有实验重叠的位置（新节点按 300×150 估）
  const boxes = rects().filter(r => r.el.dataset.id);
  const hit = (x, y) => boxes.some(b => x < b.x + b.w + 20 && x + 300 + 20 > b.x && y < b.y + b.h + 20 && y + 150 + 20 > b.y);
  while (hit(x, y)) y += 30;
  return [x, y];
}
function newExp(x, y, parent = '', init = '', auto = false) {
  if (auto) [x, y] = freeSpot(x, y);
  const id = nextId(); EXPS.push({ id, title: '（未命名）', parent, init, lit: false, page: false }); C.pos[id] = [Math.round(x), Math.round(y)]; S.fresh = id; render();
  toast(`已新建 ${id}${parent ? `，parent = ${parent}${init ? `，init = ${parent}/${init}` : ''}` : ''}。实际会写出 runs/${id}/exp.toml。`);
}
function newNote(x, y) { C.notes.push({ id: 'n' + Date.now(), x: Math.round(x), y: Math.round(y), text: '新便签' }); render(); }
function newGroup(x, y) { C.groups.push({ id: 'g' + Date.now(), c: ['c1', 'c2', 'c3', 'c4'][C.groups.length % 4], x: Math.round(x), y: Math.round(y), w: 460, h: 300, title: '新分组' }); render(); }
function reparent(childId, parentId, m) {
  const c = byId(childId);
  if (ancestors(parentId).includes(childId)) { toast(`不能把 ${childId} 接到它自己的后代 ${parentId} 下面。`); return; }
  c.parent = parentId; c.init = m === '_' ? '' : m; render();
  toast(`${childId} 的父实验改为 ${parentId}${c.init ? `（init = ${parentId}/${c.init}）` : ''}。实际会改 runs/${childId}/exp.toml；比较基准随之重算。`);
}
function delExp(id) {
  const e = byId(id); if (e.lit) { toast('已点亮的实验不能删除。'); return; }
  kids(id).forEach(c => { c.parent = ''; c.init = ''; });
  EXPS = EXPS.filter(x => x.id !== id); delete C.pos[id]; render(); toast(`已删除 ${id}（实际会删掉 runs/${id}/）。它的子实验不再有父实验。`);
}
function delNote(id) { C.notes = C.notes.filter(n => n.id !== id); render(); }
function delGroup(id) { C.groups = C.groups.filter(g => g.id !== id); render(); toast('已删除分组框，框内的实验和便签不动。'); }
function open(id) {
  S.sel = id;
  if (byId(id).page && R[id]) { location.href = `../prototype-node-page/index.html?exp=${id}&canvas=A`; return; }
  render(); toast(`原型：${id} 是模拟实验，没有节点页数据。有节点页的是 B0、B0m、E1、E2。`);
}
function editText(el, done) {
  el.contentEditable = 'true'; el.focus(); document.getSelection().selectAllChildren(el);
  const fin = () => { el.contentEditable = 'false'; el.removeEventListener('blur', fin); done(el.innerText.trim()); };
  el.addEventListener('blur', fin);
  el.addEventListener('keydown', ev => { if (ev.key === 'Enter' && (!ev.shiftKey || el.classList.contains('gt'))) { ev.preventDefault(); el.blur(); } if (ev.key === 'Escape') el.blur(); ev.stopPropagation(); });
}

// ---------------- 右键菜单 ----------------
const menu = document.createElement('div'); menu.className = 'menu'; menu.hidden = true; document.body.appendChild(menu);
function showMenu(cx, cy, head, items) {
  menu.innerHTML = (head ? `<div class="h">${head}</div>` : '') + items.map((it, i) => it === '-' ? '<hr>' : `<button data-i="${i}" ${it.off ? 'disabled title="' + (it.why || '') + '"' : ''}><span>${it.t}</span>${it.k ? `<kbd>${it.k}</kbd>` : ''}</button>`).join('');
  menu.hidden = false;
  const r = menu.getBoundingClientRect();
  menu.style.left = Math.min(cx, innerWidth - r.width - 8) + 'px'; menu.style.top = Math.min(cy, innerHeight - r.height - 8) + 'px';
  menu.onclick = ev => { const b = ev.target.closest('button'); if (!b || b.disabled) return; hideMenu(); items[+b.dataset.i].f(); };
}
const hideMenu = () => { menu.hidden = true; };
vp.addEventListener('contextmenu', ev => {
  ev.preventDefault();
  const [wx, wy] = toWorld(ev.clientX, ev.clientY);
  const n = ev.target.closest('[data-id]'), row = ev.target.closest('[data-method]'), nt = ev.target.closest('[data-note]'), g = ev.target.closest('[data-grp]');
  if (n) {
    const e = byId(n.dataset.id), [x, y] = C.pos[e.id], m = row && row.dataset.method;
    const items = [{ t: '打开节点页', k: '单击', f: () => open(e.id) }, '-'];
    if (m) items.push({ t: `从 ${m} 派生新实验`, f: () => newExp(x + 420, y, e.id, m, true) });
    items.push({ t: `从 ${e.id} 派生新实验`, f: () => newExp(x + 420, y, e.id, '', true) });
    if (e.parent) items.push({ t: '断开父实验', f: () => { e.parent = ''; e.init = ''; render(); } });
    items.push('-', { t: '删除实验', k: 'Del', off: e.lit, why: '已点亮的实验不能删除', f: () => delExp(e.id) });
    showMenu(ev.clientX, ev.clientY, `${e.id}　${esc(e.title)}`, items);
  } else if (nt) {
    showMenu(ev.clientX, ev.clientY, '便签', [{ t: '编辑', k: '双击', f: () => editText(nt.querySelector('.body'), t => { C.notes.find(x => x.id === nt.dataset.note).text = t || '（空）'; render(); }) },
      { t: '删除便签', k: 'Del', f: () => delNote(nt.dataset.note) }]);
  } else if (g) {
    const o = C.groups.find(x => x.id === g.dataset.grp);
    showMenu(ev.clientX, ev.clientY, `分组：${esc(o.title)}`, [
      { t: '在此新建实验', k: 'E', f: () => newExp(wx - 150, wy - 40) },
      { t: '重命名', k: '双击标题', f: () => editText(g.querySelector('.gt'), t => { o.title = t || o.title; render(); }) },
      { t: '换颜色', f: () => { const cs = ['c1', 'c2', 'c3', 'c4']; o.c = cs[(cs.indexOf(o.c) + 1) % 4]; render(); } },
      { t: '贴合框内内容', f: () => fitGroup(o) },
      '-', { t: '删除分组框（内容保留）', k: 'Del', f: () => delGroup(o.id) }]);
  } else {
    showMenu(ev.clientX, ev.clientY, null, [
      { t: '新建实验', k: 'E', f: () => newExp(wx - 150, wy - 40) },
      { t: '新建便签', k: 'N', f: () => newNote(wx, wy) },
      { t: '新建分组框', k: 'G', f: () => newGroup(wx, wy) }, '-',
      { t: '适应窗口', k: '.', f: fit }]);
  }
});
function fitGroup(o) {   // 按当前几何包含的内容收紧框
  const rs = rects().filter(r => !r.el.dataset.grp && r.x >= o.x && r.y >= o.y && r.x + r.w <= o.x + o.w && r.y + r.h <= o.y + o.h);
  if (!rs.length) { toast('框里没有内容。'); return; }
  const x0 = Math.min(...rs.map(r => r.x)), y0 = Math.min(...rs.map(r => r.y)), x1 = Math.max(...rs.map(r => r.x + r.w)), y1 = Math.max(...rs.map(r => r.y + r.h));
  Object.assign(o, { x: Math.round(x0 - 30), y: Math.round(y0 - 60), w: Math.round(x1 - x0 + 60), h: Math.round(y1 - y0 + 90) }); render();
}

// ---------------- 鼠标：平移、拖动、拖线、调整分组大小、缩放 ----------------
let drag = null;
const toWorld = (cx, cy) => { const r = vp.getBoundingClientRect(); return [(cx - r.left - S.tx) / S.k, (cy - r.top - S.ty) / S.k]; };
vp.addEventListener('pointerdown', ev => {
  if (ev.button !== 0) return; hideMenu();
  if (ev.target.closest('[contenteditable=true]')) return;
  const [wx, wy] = toWorld(ev.clientX, ev.clientY);
  const port = ev.target.closest('.port.out'), rz = ev.target.closest('.rz');
  const n = ev.target.closest('[data-id]'), nt = ev.target.closest('[data-note]'), g = ev.target.closest('[data-grp]');
  if (port) { const [, id, m] = port.dataset.port.split(':'); S.link = { from: id, m, a: portXY(port.dataset.port), b: [wx, wy] }; drag = { kind: 'link' }; return; }
  if (rz) { const o = C.groups.find(x => x.id === g.dataset.grp); drag = { kind: 'resize', o, sx: wx, sy: wy, w: o.w, h: o.h }; return; }
  if (n) { const p = C.pos[n.dataset.id]; drag = { kind: 'node', id: n.dataset.id, ox: wx - p[0], oy: wy - p[1], moved: 0, sx: ev.clientX, sy: ev.clientY }; }
  else if (nt) { const o = C.notes.find(x => x.id === nt.dataset.note); drag = { kind: 'note', o, ox: wx - o.x, oy: wy - o.y }; }
  else if (g && ev.target.closest('.gt')) {   // 拖标题栏：几何包含的实验和便签一起移动
    const o = C.groups.find(x => x.id === g.dataset.grp), rs = rects();
    const inside = r => r.x >= o.x && r.y >= o.y && r.x + r.w <= o.x + o.w && r.y + r.h <= o.y + o.h;
    drag = { kind: 'group', o, ox: wx - o.x, oy: wy - o.y,
      mem: rs.filter(r => r.el.dataset.id && inside(r)).map(r => [r.el.dataset.id, C.pos[r.el.dataset.id][0] - o.x, C.pos[r.el.dataset.id][1] - o.y]),
      nts: rs.filter(r => r.el.dataset.note && inside(r)).map(r => { const nn = C.notes.find(x => x.id === r.el.dataset.note); return [nn, nn.x - o.x, nn.y - o.y]; }) };
  } else { drag = { kind: 'pan', sx: ev.clientX - S.tx, sy: ev.clientY - S.ty }; vp.classList.add('panning'); }
});
window.addEventListener('pointermove', ev => {
  S.mouse = [ev.clientX, ev.clientY];
  if (!drag) return;
  const [wx, wy] = toWorld(ev.clientX, ev.clientY);
  if (drag.kind === 'pan') { S.tx = ev.clientX - drag.sx; S.ty = ev.clientY - drag.sy; applyView(); return; }
  if (drag.kind === 'link') {
    S.link.b = [wx, wy]; drawEdges();
    layer.querySelectorAll('.drop').forEach(x => x.classList.remove('drop'));
    const t = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('[data-id]'); if (t && t.dataset.id !== S.link.from) t.classList.add('drop');
    return;
  }
  if (drag.kind === 'resize') { drag.o.w = Math.max(220, Math.round(drag.w + wx - drag.sx)); drag.o.h = Math.max(120, Math.round(drag.h + wy - drag.sy)); render(); return; }
  if (drag.kind === 'node') { drag.moved = Math.max(drag.moved, Math.hypot(ev.clientX - drag.sx, ev.clientY - drag.sy)); if (drag.moved < 4) return; C.pos[drag.id] = [Math.round(wx - drag.ox), Math.round(wy - drag.oy)]; }
  else if (drag.kind === 'note') { drag.o.x = Math.round(wx - drag.ox); drag.o.y = Math.round(wy - drag.oy); }
  else if (drag.kind === 'group') { const o = drag.o; o.x = Math.round(wx - drag.ox); o.y = Math.round(wy - drag.oy);
    drag.mem.forEach(([id, dx, dy]) => C.pos[id] = [o.x + dx, o.y + dy]); drag.nts.forEach(([nn, dx, dy]) => { nn.x = o.x + dx; nn.y = o.y + dy; }); }
  render();
});
window.addEventListener('pointerup', ev => {
  if (drag && drag.kind === 'link') {
    const t = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('[data-id]'), L = S.link; S.link = null;
    if (t && t.dataset.id !== L.from) reparent(t.dataset.id, L.from, L.m);
    else if (!t) { const [wx, wy] = toWorld(ev.clientX, ev.clientY); newExp(wx + 6, wy - 50, L.from, L.m === '_' ? '' : L.m); }
    else drawEdges();
  }
  if (drag && drag.kind === 'node' && drag.moved < 4) open(drag.id);
  drag = null; vp.classList.remove('panning');
});
vp.addEventListener('dblclick', ev => {
  const g = ev.target.closest('[data-grp]'), nt = ev.target.closest('[data-note]');
  if (ev.target.closest('.gt')) { const o = C.groups.find(x => x.id === g.dataset.grp); editText(ev.target.closest('.gt'), t => { o.title = t || o.title; render(); }); return; }
  if (nt) { editText(nt.querySelector('.body'), t => { C.notes.find(x => x.id === nt.dataset.note).text = t || '（空）'; render(); }); return; }
  if (ev.target.closest('[data-id]')) return;
  const [wx, wy] = toWorld(ev.clientX, ev.clientY); newExp(wx - 150, wy - 40);
});
vp.addEventListener('wheel', ev => { ev.preventDefault(); const r = vp.getBoundingClientRect(); zoomAt(S.k * Math.exp(-ev.deltaY * .0015), ev.clientX - r.left, ev.clientY - r.top); }, { passive: false });

// ---------------- 键盘 ----------------
window.addEventListener('keydown', ev => {
  if (ev.target.closest && ev.target.closest('[contenteditable=true], input, textarea')) return;
  const [wx, wy] = toWorld(...S.mouse), r = vp.getBoundingClientRect();
  const under = document.elementFromPoint(...S.mouse);
  switch (ev.key) {
    case 'e': case 'E': newExp(wx - 150, wy - 40); break;
    case 'n': case 'N': newNote(wx, wy); break;
    case 'g': case 'G': newGroup(wx, wy); break;
    case '.': fit(); break;
    case '+': case '=': zoomAt(S.k * 1.2, r.width / 2, r.height / 2); break;
    case '-': case '_': zoomAt(S.k / 1.2, r.width / 2, r.height / 2); break;
    case '?': $('#keys').classList.toggle('on'); break;
    case 'Escape': hideMenu(); $('#keys').classList.remove('on'); if (S.link) { S.link = null; drag = null; drawEdges(); } break;
    case 'Delete': case 'Backspace': {
      const n = under?.closest('[data-id]'), nt = under?.closest('[data-note]'), g = under?.closest('[data-grp]');
      if (n) delExp(n.dataset.id); else if (nt) delNote(nt.dataset.note); else if (g) delGroup(g.dataset.grp);
      break; }
    case 'Enter': if (ev.target.dataset && ev.target.dataset.id) open(ev.target.dataset.id); break;
    default: return;
  }
  ev.preventDefault();
});
document.addEventListener('pointerdown', ev => { if (!ev.target.closest('.menu')) hideMenu(); if (!ev.target.closest('.keys, #keysbtn')) $('#keys').classList.remove('on'); });
$('#keysbtn').onclick = () => $('#keys').classList.toggle('on');
document.querySelector('.act').addEventListener('click', ev => {
  const b = ev.target.closest('[data-cmd]'); if (!b) return;
  const r = vp.getBoundingClientRect(), [cx, cy] = toWorld(r.left + r.width / 2, r.top + r.height / 2);
  ({ exp: () => newExp(cx - 150, cy - 60), note: () => newNote(cx - 115, cy - 30), group: () => newGroup(cx - 230, cy - 150), fit,
     zin: () => zoomAt(S.k * 1.2, r.width / 2, r.height / 2), zout: () => zoomAt(S.k / 1.2, r.width / 2, r.height / 2) })[b.dataset.cmd]();
});
let tt; function toast(s) { const t = $('#toast'); t.textContent = s; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 3800); }

// ---------------- 启动：从节点页返回时 ?focus=<id> 居中并选中 ----------------
const focus = byId(new URLSearchParams(location.search).get('focus')) ? new URLSearchParams(location.search).get('focus') : null;
if (focus) S.sel = focus;
function settle() { render(); if (focus) centerOn(focus); else fit(); drawEdges(); }
settle();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(settle);
window.addEventListener('resize', () => applyView());
</script>
</body>
</html>
