# E49（#261）底座（照抄 E44 的 _e41）：E41 `main__screen0.8` 原样展开（E41 configs/_e37all.toml + [rloo] screen = 0.8），不训练，只当 base。
# E37 底座：E36 `_e36` 原样（EMA 参照 + warmup 后恒定学习率，4 卡数据并行，每次更新 4 对；粗匹配照 E28 `fm`，
# 细化逐级局部抽签、每级抽 8 次，cauchy 奖励，画面外处理，可信度一起学，细化损失系数 4.2，难版扰动，DINOv2 qkv LoRA r 8，
# VGG 放开），学习率 2e-4 / LoRA 4e-4，τ 0.996，训练集 4 遍 = 7907 次更新，细化尺度 16、8、4、2、1 都加监督。种子 0。
[model]
name = "roma"
lora_r = 8
train_vgg = true
refine_lr = 0.47
vgg_lr = 0.47
lora_lr = 4e-4

[optim]
lr = 2e-4
steps = 7907
warmup = 125
sched = "const"

[aug]
shift = 128.0
shift_disk = true
rot = 20.0
scale = 0.2
photo = false
erase = true

[rloo]
reward = "ref"
baseline = "loo"
temp = 0.3
shape = "gauss"
delta = 8.0
frame_mask = true
cert_bce = 0.01
fine_shape = "cauchy"
levels = [16, 8, 4, 2, 1]
k = 0.5
fine_mode = "local"
fine_group = 8
fine_mask = true
fine_cert_bce = 0.01
fine_w = 4.2
ref_ema = 0.996
screen = 0.8

[run]
seed = 0
ddp = 4
save_every = 250
save_zero = false
save_optim = false
sweep = "last"
halt_above = {d_ref = 100.0}
halt_below = {in_frame = 0.5}
halt_window = 200
