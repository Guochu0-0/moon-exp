<!doctype html>
<!-- PROTOTYPE（一次性）：「节点页内容：自动生成与可编辑的边界」#20，第三版。
     结构固定：页头元数据 → 比较设置 → 指标表 → 误差图 → 逐对查看 → 训练图表（TensorBoard 日志）→ Notes。
     ?exp=B0|B0m|E1|E2。数据是 data.js 快照（gen_data.py 生成）；E1 / E2 是模拟实验。Notes 的修改只存在内存里。 -->
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE · 节点页</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<script src="data.js"></script>
<style>
  :root {
    --desk: #ECEEF1; --paper: #fff; --ink: #1D2230; --muted: #676D78; --rule: #D5D8DD; --wash: #F3F5F8;
    --me: #1F3A93; --ref: #8A8F99; --other: #C9CDD4;
    --serif: "Source Serif 4", "Noto Serif SC", "Source Han Serif SC", "SimSun", serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--desk); color: var(--ink); font: 15.5px/1.7 var(--serif); }
  button, select, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--me); outline-offset: 2px; }
  a { color: var(--me); text-decoration: none; cursor: pointer; }
  a:hover { text-decoration: underline; }
  .num { font-variant-numeric: tabular-nums lining-nums; }
  .muted { color: var(--muted); }

  /* 原型控制栏（不属于页面设计） */
  .proto { background: #2A2F38; color: #D8DCE2; font: 12.5px/1.4 "Microsoft YaHei", sans-serif; padding: 6px 20px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .proto button { background: transparent; color: #D8DCE2; border: 1px solid #4A515C; border-radius: 3px; padding: 1px 9px; cursor: pointer; }
  .proto button[aria-pressed=true] { background: #D8DCE2; color: #2A2F38; }
  .proto .sp { flex: 1; }
  .proto pre { flex-basis: 100%; margin: 6px 0 2px; white-space: pre-wrap; font: 12px/1.5 Consolas, monospace; color: #C4C9D1; }

  /* 纸面 */
  .page { background: var(--paper); max-width: 1160px; margin: 28px auto 80px; padding: 44px 64px 56px; border: 1px solid var(--rule); }
  .back { font-size: 14px; color: var(--muted); }
  h1 { font-size: 30px; line-height: 1.3; font-weight: 600; margin: 12px 0 18px; }
  h1 .id { margin-right: .6em; }
  h2.first { border-top: 0; margin-top: 26px; padding-top: 0; }
  h2 { font-size: 18px; font-weight: 600; margin: 40px 0 12px; padding-top: 12px; border-top: 1px solid var(--rule); }

  /* 页头元数据 */
  .meta { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px 32px; margin: 0; padding: 12px 0; border-top: 1.5px solid var(--ink); border-bottom: 1px solid var(--rule); font-size: 14.5px; }
  .meta div { display: flex; gap: 12px; min-width: 0; }
  .meta dt { color: var(--muted); flex: 0 0 4.5em; }
  .meta dd { margin: 0; overflow-wrap: anywhere; }

  /* 比较设置 */
  .cmp { display: flex; flex-wrap: wrap; gap: 14px 30px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--rule); font-size: 14.5px; }
  .cmp label { color: var(--muted); margin-right: 8px; }
  .cmp select { border: 1px solid var(--rule); border-radius: 2px; background: var(--paper); padding: 3px 8px; font-size: 14.5px; max-width: 340px; }
  .cmp select.me { border-color: var(--me); color: var(--me); }
  .radio { display: inline-flex; border: 1px solid var(--rule); border-radius: 2px; overflow: hidden; vertical-align: middle; }
  .radio button { border: 0; background: var(--paper); padding: 2px 14px; cursor: pointer; font-size: 14px; }
  .radio button + button { border-left: 1px solid var(--rule); }
  .radio button[aria-pressed=true] { background: var(--ink); color: var(--paper); }
  .radio button:disabled { color: var(--other); cursor: not-allowed; }
  .key { display: inline-block; width: 22px; vertical-align: middle; margin-right: 6px; border-top: 2.5px solid var(--me); }
  .key.ref { border-top: 2px dashed var(--ref); }

  /* 表：三线表 */
  .caption { font-size: 14px; line-height: 1.6; margin: 26px 0 8px; }
  .caption b { font-weight: 600; margin-right: .6em; }
  .figcap { margin: 8px 0 0; }
  table.tab { width: 100%; border-collapse: collapse; border-top: 1.5px solid var(--ink); border-bottom: 1.5px solid var(--ink); font-size: 14.5px; }
  table.tab th { font-weight: 600; text-align: right; padding: 6px 7px; border-bottom: 1px solid var(--ink); white-space: nowrap; }
  table.tab td { text-align: right; padding: 4px 7px; white-space: nowrap; }
  table.tab th:first-child, table.tab td:first-child { text-align: left; padding-left: 2px; }
  table.tab .ci { color: var(--muted); font-size: 12.5px; margin-left: 4px; }
  table.tab tr.pick { cursor: pointer; }
  table.tab tr.pick:hover td { background: var(--wash); }
  table.tab tr.on td { background: #E8ECF6; }
  table.tab tr.on td:first-child { box-shadow: inset 3px 0 0 var(--me); }
  table.tab td.me { color: var(--me); }
  table.tab td.ref { color: var(--muted); }
  .scroll { overflow-x: auto; }

  /* 图 */
  .figs { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 36px; align-items: start; }
  figure { margin: 26px 0 0; }
  figure svg { display: block; width: 100%; height: auto; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 13px; color: var(--muted); margin-top: 4px; }
  .oc-row { display: grid; grid-template-columns: minmax(90px, 38%) 1fr; gap: 10px; align-items: center; font-size: 13px; margin: 3px 0; }
  .oc-row span:first-child { text-align: right; overflow-wrap: anywhere; line-height: 1.35; }
  .oc-row.on span:first-child { color: var(--me); font-weight: 600; }
  .oc-bar { display: flex; height: 13px; }
  .oc-bar i { display: block; min-width: 0; }
  .swatch { display: inline-block; width: 10px; height: 10px; margin-right: 5px; vertical-align: -1px; }

  /* 逐对查看 */
  .pv { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 22px; font-size: 14px; }
  .pv .cats button { display: flex; justify-content: space-between; width: 100%; border: 0; border-top: 1px solid var(--rule); background: transparent; padding: 7px 4px; cursor: pointer; text-align: left; }
  .pv .cats button:last-of-type { border-bottom: 1px solid var(--rule); }
  .pv .cats button[aria-pressed=true] { background: #E8ECF6; }
  .pv .cats button:disabled { color: var(--other); cursor: default; }
  .pv .find { margin-top: 12px; display: flex; gap: 6px; align-items: center; }
  .pv .find input { width: 90px; border: 1px solid var(--rule); padding: 2px 6px; }
  .pv .views { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-bottom: 8px; color: var(--muted); }
  .pv .views span[aria-current] { color: var(--ink); border-bottom: 1.5px solid var(--ink); }
  .pv .stage { height: 360px; background: repeating-conic-gradient(#E3E6EA 0 25%, #F2F3F5 0 50%) 0 0 / 44px 44px; }

  /* 训练图表 */
  .tb { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px 28px; }
  .tb .tag { font-size: 13.5px; margin-bottom: 2px; }
  .tbhead { display: flex; justify-content: space-between; align-items: baseline; }
  .tbhead a { font-size: 14px; }

  /* Notes */
  .notes { min-height: 9em; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 2px; white-space: pre-wrap; outline: none; line-height: 1.85; }
  .notes:focus { border-color: var(--me); box-shadow: 0 0 0 1px var(--me); }
  .notes:empty::before { content: "（空）"; color: var(--other); }
  .notes-foot { font-size: 13px; color: var(--muted); margin-top: 6px; }

  @media (max-width: 860px) {
    .page { margin: 0; padding: 22px 18px; border: 0; }
    .meta { grid-template-columns: 1fr; }
    .figs, .pv { grid-template-columns: 1fr; }
    .tb { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="proto" id="proto"></div>
<main class="page" id="app"></main>
<script>
/* ======================= 数据 ======================= */
const D = window.DATA, R = D.runs, P = D.protocol, MAIN = P.main, MAINU = MAIN.toUpperCase();
const IDENT = 'B0/identity', NONE = '';
const q = new URLSearchParams(location.search);
const S = { exp: R[q.get('exp')] ? q.get('exp') : 'E1', method: {}, ref: {}, split: 'val', cat: 'better', wb: false };
const NOTES = {};   // 将写回 runs/<id>/notes.md

const keyOf = (rid, m) => `${rid}/${m}`;
const ev = (k, s) => { if (!k) return null; const [rid, m] = k.split('/'); return R[rid]?.metrics?.[m]?.[s]; };
const sm = (k, s) => ev(k, s)?.summary;
const methods = r => Object.keys(r.metrics);
const multi = r => methods(r).length > 1;
const ranked = r => methods(r).slice().sort((a, b) => (sm(keyOf(r.id, b), 'val')?.[MAIN] ?? -1) - (sm(keyOf(r.id, a), 'val')?.[MAIN] ?? -1));
const best = r => ranked(r)[0];
const label = k => !k ? '无' : k === IDENT ? '未配准（恒等变换）' : k.endsWith('/main') ? k.slice(0, -5) : k.replace('/', ' / ');
const kids = r => Object.values(R).filter(x => x.meta.parent === r.id);
const curM = r => S.method[r.id] && r.metrics[S.method[r.id]] ? S.method[r.id] : best(r);
/* 默认参考：有 init 用 init；父实验里有同名基础方法（<方法>__<变体>）就用它；否则父实验 Val 主指标最好的方法；基线无参考 */
function defaultRef(r, m) {
  if (r.meta.init) return r.meta.init;
  const p = R[r.meta.parent];
  if (p?.lit) { const base = m.split('__')[0]; return p.metrics[base] ? keyOf(p.id, base) : keyOf(p.id, best(p)); }
  return r.meta.baseline ? NONE : IDENT;
}
const curRef = r => r.id in S.ref ? S.ref[r.id] : defaultRef(r, curM(r));
const splitOk = (r, s) => !!ev(keyOf(r.id, curM(r)), s) && (!curRef(r) || !!ev(curRef(r), s));
const notesOf = r => NOTES[r.id] ?? r.meta.notes ?? '';

/* ======================= 格式化 ======================= */
const pct = x => x == null ? '—' : (x * 100).toFixed(1);
const pxf = x => x == null ? '—' : x.toFixed(2);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sgn = (d, f) => { if (d == null || isNaN(d)) return '—'; const t = f(Math.abs(d)); return Number(t) === 0 ? t : (d > 0 ? '+' : '−') + t; };
const SPLIT = () => S.split === 'val' ? 'Val' : 'Test';
const METRICS = () => [...P.auc_thresholds.map(t => [`AUC@${t}`, `auc@${t}`, 'pct']), ...P.sr_thresholds.map(t => [`SR@${t}`, `sr@${t}`, 'pct']),
  ['失败率', 'fail_rate', 'pct'], [`错配率（>${P.t_coarse} px）`, 'mis_rate', 'pct'], ['成功 pair 误差均值（px）', 'succ_mean', 'px'], ['成功 pair 误差中位数（px）', 'succ_median', 'px']];

/* ======================= 图表编号 ======================= */
let TAB = 0, FIG = 0;
const tabNo = () => ++TAB, figNo = () => ++FIG;

/* ======================= 页头 ======================= */
function header(r) {
  const p = R[r.meta.parent], k = kids(r);
  const rows = [
    ['父实验', p ? `<a onclick="go('${p.id}')">${p.id}</a>` : '无'],
    ['起点方法', r.meta.init ? esc(r.meta.init) : '无'],
    ['子实验', k.length ? k.map(c => `<a onclick="go('${c.id}')">${c.id}</a>`).join('，') : '无'],
    ['状态', (r.lit ? '已点亮' : '未点亮') + (r.meta.baseline ? '，基线' : '')],
    ['日期', esc(r.meta.date || '—')],
    ['commit', r.meta.commit ? `<span class="num">${esc(r.meta.commit)}</span>` : '—'],
  ];
  if (multi(r)) rows.splice(3, 0, ['方法数', `<span class="num">${methods(r).length}</span>`]);
  return `<a class="back" href="#" onclick="return false">← 画布</a><h1><span class="id">${r.id}</span>${esc(r.meta.title)}</h1>
    <dl class="meta">${rows.map(([t, d]) => `<div><dt>${t}</dt><dd>${d}</dd></div>`).join('')}</dl>`;
}

/* ======================= 比较设置 ======================= */
function refOptions(r) {
  const m = curM(r), def = defaultRef(r, m), cur = curRef(r), groups = [];
  const p = R[r.meta.parent];
  if (p?.lit) groups.push([`父实验 ${p.id}`, ranked(p).map(x => keyOf(p.id, x))]);
  if (multi(r)) groups.push([`本实验 ${r.id}`, ranked(r).filter(x => x !== m).map(x => keyOf(r.id, x))]);
  Object.values(R).filter(x => x.lit && x.id !== r.id && x.id !== p?.id).forEach(x => groups.push([`实验 ${x.id}`, ranked(x).map(y => keyOf(x.id, y)).filter(k => k !== IDENT)]));
  groups.push(['其他', [IDENT, NONE]]);
  const opt = k => `<option value="${k}" ${k === cur ? 'selected' : ''}>${esc(label(k))}${k === def ? '（默认）' : ''}</option>`;
  return groups.map(([g, ks]) => `<optgroup label="${g}">${ks.map(opt).join('')}</optgroup>`).join('');
}
function compare(r) {
  const m = curM(r);
  return `<div class="cmp">
    ${multi(r) ? `<span><label for="selM"><span class="key"></span>方法</label><select id="selM" class="me" onchange="S.method['${r.id}']=this.value;delete S.ref['${r.id}'];render()">${ranked(r).map(x => `<option value="${x}" ${x === m ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></span>`
      : `<span><span class="key"></span><span class="muted">方法</span>　${esc(label(keyOf(r.id, m)))}</span>`}
    <span><label for="selR"><span class="key ref"></span>参考方法</label><select id="selR" onchange="S.ref['${r.id}']=this.value;render()">${refOptions(r)}</select></span>
    <span><span class="muted" style="margin-right:8px">数据集</span><span class="radio" role="group" aria-label="数据集">
      <button aria-pressed="${S.split === 'val'}" onclick="S.split='val';render()">Val</button><button aria-pressed="${S.split === 'test'}" ${splitOk(r, 'test') ? '' : 'disabled title="无 Test 结果"'} onclick="S.split='test';render()">Test</button></span></span>
  </div>`;
}

/* ======================= 表 ======================= */
function methodsTable(r) {
  const s = S.split, cm = curM(r), p = R[r.meta.parent];
  const cols = [...P.auc_thresholds.map(t => [`AUC@${t}`, `auc@${t}`, pct]), ['SR@5', 'sr@5', pct], ['失败率', 'fail_rate', pct], ['错配率', 'mis_rate', pct], ['误差中位数（px）', 'succ_median', pxf]];
  const withBase = p?.lit;
  const n = tabNo();
  return `<p class="caption"><b>表 ${n}</b>${r.id} 各方法在 ${SPLIT()} 上的指标，按 ${MAINU} 降序。AUC、SR、失败率、错配率单位为 %；${MAINU} 后为 bootstrap 95% 置信区间；误差中位数只统计成功 pair。${withBase ? `末列为相对父实验 ${p.id} 中同名基础方法的 ${MAINU} 差值。` : ''}点击一行设为当前方法。</p>
    <div class="scroll"><table class="tab num"><tr><th>方法</th>${cols.map(c => `<th>${c[0]}</th>`).join('')}${withBase ? `<th>Δ${MAINU}</th>` : ''}</tr>
    ${ranked(r).map(x => { const k = keyOf(r.id, x), v = sm(k, s) || {}, ci = v[MAIN + '_ci'];
      return `<tr class="pick ${x === cm ? 'on' : ''}" onclick="S.method['${r.id}']='${x}';delete S.ref['${r.id}'];render()"><td>${esc(x)}</td>
        ${cols.map(([, kk, f]) => `<td>${f(v[kk])}${kk === MAIN && ci ? `<span class="ci">[${pct(ci[0])}, ${pct(ci[1])}]</span>` : ''}</td>`).join('')}
        ${withBase ? `<td>${sgn((v[MAIN] - sm(defaultRef(r, x), s)?.[MAIN]) * 100, a => a.toFixed(1))}</td>` : ''}</tr>`; }).join('')}</table></div>`;
}
function pairTable(r) {
  const s = S.split, k = keyOf(r.id, curM(r)), rf = curRef(r), a = sm(k, s) || {}, b = sm(rf, s) || {};
  const n = tabNo();
  return `<p class="caption"><b>表 ${n}</b>${esc(label(k))}${rf ? ` 与参考方法 ${esc(label(rf))}` : ''} 在 ${SPLIT()} 上的全部指标（n = <span class="num">${a.n ?? '—'}</span> 个有标注 pair）。AUC、SR、失败率、错配率单位为 %；方括号内为 bootstrap 95% 置信区间${rf ? '；差值 = 方法 − 参考方法' : ''}。</p>
    <table class="tab num"><tr><th>指标</th><th>${esc(label(k))}</th>${rf ? `<th>${esc(label(rf))}</th><th>差值</th>` : ''}</tr>
    ${METRICS().map(([nm, kk, u]) => { const f = u === 'px' ? pxf : pct, ci = kk.startsWith('auc') || kk.startsWith('sr') ? a[kk + '_ci'] : null, cr = b[kk + '_ci'] && ci ? b[kk + '_ci'] : null;
      return `<tr><td>${nm}</td><td class="me">${f(a[kk])}${ci ? `<span class="ci">[${pct(ci[0])}, ${pct(ci[1])}]</span>` : ''}</td>
        ${rf ? `<td class="ref">${f(b[kk])}${cr ? `<span class="ci">[${pct(cr[0])}, ${pct(cr[1])}]</span>` : ''}</td><td>${sgn(u === 'px' ? a[kk] - b[kk] : (a[kk] - b[kk]) * 100, x => x.toFixed(u === 'px' ? 2 : 1))}</td>` : ''}</tr>`; }).join('')}</table>`;
}

/* ======================= 图 ======================= */
function cdfFigure(r) {
  const s = S.split, m = curM(r), k = keyOf(r.id, m), rf = curRef(r);
  const W = 640, H = 330, L = 46, B = 40, X = 30, pw = W - L - 12, ph = H - B - 12;
  const xs = v => L + v / X * pw, ys = f => 12 + ph - f * ph;
  const F = kk => { const e = ev(kk, s)?.errors; if (!e) return null; const v = e.filter(x => x != null).sort((a, b) => a - b), n = e.length;
    return x => { let lo = 0, hi = v.length; while (lo < hi) { const mm = (lo + hi) >> 1; v[mm] <= x ? lo = mm + 1 : hi = mm; } return lo / n; }; };
  const path = kk => { const f = F(kk); if (!f) return ''; let d = ''; for (let x = 0; x <= X + 1e-9; x += .1) d += `${d ? 'L' : 'M'}${xs(x).toFixed(1)},${ys(f(x)).toFixed(1)}`; return d; };
  let g = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="误差累积分布"><g font-size="12" fill="#676D78" font-family="Source Serif 4, serif">`;
  for (const t of [0, 5, 10, 15, 20, 25, 30]) g += `<line x1="${xs(t)}" x2="${xs(t)}" y1="${12 + ph}" y2="${16 + ph}" stroke="#1D2230"/><text x="${xs(t)}" y="${ph + 30}" text-anchor="middle">${t}</text>`;
  for (const f of [0, .25, .5, .75, 1]) g += `<line x1="${L - 4}" x2="${L}" y1="${ys(f)}" y2="${ys(f)}" stroke="#1D2230"/><line x1="${L}" x2="${W - 12}" y1="${ys(f)}" y2="${ys(f)}" stroke="#ECEEF1"/><text x="${L - 8}" y="${ys(f) + 4}" text-anchor="end">${f * 100}</text>`;
  g += `<line x1="${L}" x2="${L}" y1="12" y2="${12 + ph}" stroke="#1D2230"/><line x1="${L}" x2="${W - 12}" y1="${12 + ph}" y2="${12 + ph}" stroke="#1D2230"/>`;
  g += `<text x="${L + pw / 2}" y="${H - 2}" text-anchor="middle">误差阈值（px）</text><text transform="translate(12 ${12 + ph / 2}) rotate(-90)" text-anchor="middle">累积占比（%）</text></g>`;
  let legend = '';
  if (multi(r) && !rf) { for (const x of methods(r)) if (x !== m) g += `<path d="${path(keyOf(r.id, x))}" fill="none" stroke="#C9CDD4" stroke-width="1"/>`;
    legend = `<span><span class="key"></span>${esc(m)}</span><span><span class="key" style="border-top:1px solid #C9CDD4"></span>${r.id} 的其他 ${methods(r).length - 1} 个方法</span>`; }
  if (rf) { g += `<path d="${path(rf)}" fill="none" stroke="#8A8F99" stroke-width="1.6" stroke-dasharray="5 4"/>`; }
  g += `<path d="${path(k)}" fill="none" stroke="#1F3A93" stroke-width="2.2"/></svg>`;
  if (!legend) legend = `<span><span class="key"></span>${esc(label(k))}</span>${rf ? `<span><span class="key ref"></span>${esc(label(rf))}</span>` : ''}`;
  const n = figNo();
  return `<figure>${g}<div class="legend">${legend}</div><p class="caption figcap"><b>图 ${n}</b>${SPLIT()} 上配准误差的累积分布：纵轴为误差不超过横轴阈值的 pair 占比。失败的 pair 计为误差无穷大，不进入曲线。</p></figure>`;
}
function outcomeFigure(r) {
  const s = S.split, m = curM(r), rf = curRef(r), T = P.t_coarse;
  const C = [['≤5 px', '#1F3A93'], [`5–${T} px`, '#7F97C9'], [`>${T} px（错配）`, '#C7D1E6'], ['失败', '#A9ADB5']];
  const cls = e => e == null ? 3 : e <= 5 ? 0 : e <= T ? 1 : 2;
  const keys = rf ? [keyOf(r.id, m), rf] : multi(r) ? ranked(r).map(x => keyOf(r.id, x)) : [keyOf(r.id, m)];
  const rows = keys.filter(k => ev(k, s)).map(k => { const e = ev(k, s).errors, cnt = [0, 0, 0, 0]; e.forEach(v => cnt[cls(v)]++);
    return `<div class="oc-row ${k === keyOf(r.id, m) ? 'on' : ''}"><span title="${esc(label(k))}">${esc(rf || !multi(r) ? label(k) : k.split('/')[1])}</span><span class="oc-bar">${cnt.map((c, j) => `<i style="flex:${c};background:${C[j][1]}" title="${C[j][0]}：${c} / ${e.length}"></i>`).join('')}</span></div>`; }).join('');
  const n = figNo();
  return `<figure>${rows}<div class="legend" style="margin-top:10px">${C.map(([t, c]) => `<span><span class="swatch" style="background:${c}"></span>${t}</span>`).join('')}</div>
    <p class="caption figcap"><b>图 ${n}</b>${SPLIT()} 上各 pair 按配准误差分档的占比。</p></figure>`;
}

/* ======================= 逐对查看 ======================= */
function pairViewer(r) {
  const s = S.split, k = keyOf(r.id, curM(r)), rf = curRef(r), e = ev(k, s)?.errors, f = ev(rf, s)?.errors;
  let c = null;
  if (e && f) { c = { better: 0, worse: 0, neither: 0, both: 0 }; e.forEach((v, i) => { const a = (v ?? 1e9) <= 5, b = (f[i] ?? 1e9) <= 5; c[a && !b ? 'better' : !a && b ? 'worse' : a ? 'both' : 'neither']++; }); }
  const cats = [['better', '改善'], ['worse', '退化'], ['neither', '均未配准'], ['both', '均配准']];
  if (!c && S.cat !== 'worst') S.cat = 'worst';
  return `<h2>逐对查看</h2><div class="pv"><div class="cats">
    <div class="muted" style="font-size:13px;margin-bottom:6px">${c ? `相对 ${esc(label(rf))}，以 5 px 为界` : '分类需要参考方法'}</div>
    ${cats.map(([id, n]) => `<button aria-pressed="${S.cat === id}" ${c ? '' : 'disabled'} onclick="S.cat='${id}';render()"><span>${n}</span><span class="num">${c ? c[id] : '—'}</span></button>`).join('')}
    <button aria-pressed="${S.cat === 'worst'}" onclick="S.cat='worst';render()"><span>误差最大的 20 个</span></button>
    <div class="find"><label for="pno" class="muted">编号</label><input id="pno" placeholder="${SPLIT()} #0137"></div></div>
    <div><div class="views"><span aria-current="true">棋盘格叠加</span><span>原图并排</span><span>卷帘</span><span>点对连线</span><span>残差点图</span><span>全方法缩略图</span></div><div class="stage"></div></div></div>`;
}

/* ======================= 训练图表（读 TensorBoard 日志） ======================= */
function tbFigure(r) {
  if (!r.tb) return '';
  const { step, scalars, logdir } = r.tb, W = 300, H = 170, L = 50, B = 26, pw = W - L - 8, ph = H - B - 10, sx = step[step.length - 1];
  const fmt = v => Math.abs(v) < 1e-3 && v !== 0 ? v.toExponential(1) : Math.abs(v) >= 100 ? v.toFixed(0) : v.toPrecision(3);
  const charts = Object.entries(scalars).map(([tag, v]) => {
    const lo = Math.min(...v), hi = Math.max(...v), ys = y => 10 + ph - (y - lo) / (hi - lo || 1) * ph, xs = x => L + x / sx * pw;
    let g = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(tag)}"><g font-size="10.5" fill="#676D78" font-family="Source Serif 4, serif">`;
    for (const t of [lo, (lo + hi) / 2, hi]) g += `<line x1="${L}" x2="${W - 8}" y1="${ys(t)}" y2="${ys(t)}" stroke="#ECEEF1"/><text x="${L - 5}" y="${ys(t) + 3.5}" text-anchor="end">${fmt(t)}</text>`;
    for (const t of [0, sx / 2, sx]) g += `<text x="${xs(t)}" y="${H - 8}" text-anchor="middle">${t >= 1000 ? t / 1000 + 'k' : t}</text>`;
    g += `<line x1="${L}" x2="${L}" y1="10" y2="${10 + ph}" stroke="#1D2230"/><line x1="${L}" x2="${W - 8}" y1="${10 + ph}" y2="${10 + ph}" stroke="#1D2230"/></g>`;
    g += `<path fill="none" stroke="#1F3A93" stroke-width="1.5" d="${v.map((y, i) => `${i ? 'L' : 'M'}${xs(step[i]).toFixed(1)},${ys(y).toFixed(1)}`).join('')}"/></svg>`;
    return `<div><div class="tag">${esc(tag)}</div>${g}</div>`; }).join('');
  const n = figNo();
  return `<div class="tbhead"><h2 style="flex:1">训练图表</h2><a href="#" onclick="return false" title="启动 tensorboard --logdir ${esc(logdir)} 并打开">在 TensorBoard 中打开</a></div>
    <figure style="margin-top:6px"><div class="tb">${charts}</div><p class="caption figcap"><b>图 ${n}</b>训练过程中记录的标量，横轴为 step。数据读自 ${esc(logdir)}/ 下的 TensorBoard 日志。</p></figure>`;
}

/* ======================= Notes ======================= */
function notes(r) {
  return `<h2>Notes</h2><div class="notes" contenteditable="true" spellcheck="false" data-rid="${r.id}" oninput="NOTES[this.dataset.rid]=this.innerText;proto()">${esc(notesOf(r))}</div>
    <div class="notes-foot">保存在 runs/${r.id}/notes.md</div>`;
}

/* ======================= 页面 ======================= */
function page(r) {
  TAB = 0; FIG = 0;
  if (!r.lit) return header(r) + `<p style="margin:22px 0 0">尚无结果。</p>` + notes(r);
  let h = header(r) + compare(r) + '<h2 class="first">结果</h2>';
  if (multi(r)) h += methodsTable(r);
  if (!multi(r) || curRef(r)) h += pairTable(r);
  h += `<div class="figs">${cdfFigure(r)}${outcomeFigure(r)}</div>`;
  return h + pairViewer(r) + tbFigure(r) + notes(r);
}
function proto() {
  const changed = Object.entries(NOTES).filter(([id, t]) => t.trim() !== (R[id].meta.notes ?? '').trim());
  document.getElementById('proto').innerHTML = `<b>原型</b><span>实验</span>${Object.keys(R).map(id => `<button aria-pressed="${id === S.exp}" onclick="go('${id}')">${id}</button>`).join('')}
    <span class="sp"></span><span>E1、E2 为模拟数据；逐对查看器为占位；Notes 修改只存在内存里</span>
    <button aria-pressed="${S.wb}" onclick="S.wb=!S.wb;proto()">将写回的文件（${changed.length}）</button>
    ${S.wb ? `<pre>${changed.length ? changed.map(([id, t]) => `# runs/${id}/notes.md\n${esc(t)}`).join('\n\n') : '无改动'}</pre>` : ''}`;
}
function go(id) { if (R[id]) { S.exp = id; S.cat = 'better'; render(); scrollTo(0, 0); } }
function render() {
  const r = R[S.exp];
  if (r.lit && !splitOk(r, S.split)) S.split = 'val';
  const u = new URL(location); u.searchParams.set('exp', S.exp); history.replaceState(null, '', u);
  document.getElementById('app').innerHTML = page(r);
  proto();
}
render();
</script>
</body>
</html>
