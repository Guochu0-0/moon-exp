<!doctype html>
<!-- PROTOTYPE（一次性）：「节点页内容：自动生成与可编辑的边界」#20，第四版。
     结构固定：页头元数据 → 比较设置 → 结果（表、图）→ 可视化结果 → 训练图表（TensorBoard 日志）→ Notes。
     ?exp=B0|B0m|E1|E2 切实验。
     data.js 由 gen_data.py 生成；img/ 与 pairs.js 由 render_pairs.py 从本地数据集生成（不进 git）。 -->
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE · 节点页</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<script src="data.js"></script>
<script src="pairs.js"></script>
<style>
  /* ================= 风格变量 ================= */
  body[data-style=A] {
    --desk: #ECEEF1; --paper: #fff; --ink: #1D2230; --muted: #676D78; --rule: #D5D8DD; --wash: #F3F5F8; --sel: #E8ECF6;
    --me: #1F3A93; --ref: #8A8F99; --other: #C9CDD4; --strong: #1D2230;
    --font: "Source Serif 4", "Noto Serif SC", "Source Han Serif SC", "SimSun", serif; --size: 15.5px;
  }

  /* ================= 共用 ================= */
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--desk); color: var(--ink); font: var(--size)/1.7 var(--font); }
  button, select, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--me); outline-offset: 2px; }
  a { color: var(--me); text-decoration: none; cursor: pointer; }
  a:hover { text-decoration: underline; }
  .num { font-variant-numeric: tabular-nums lining-nums; }
  .muted { color: var(--muted); }
  .back { font-size: 14px; color: var(--muted); }
  h1 { font-size: 30px; line-height: 1.3; font-weight: 600; margin: 12px 0 18px; }
  h1 .id { margin-right: .6em; }
  h2 { font-size: 18px; font-weight: 600; margin: 0 0 12px; }
  .sec { margin-top: 40px; padding-top: 12px; border-top: 1px solid var(--rule); }
  .sec.head { margin-top: 0; padding-top: 0; border-top: 0; }
  .sec .n { display: none; }

  .meta { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px 32px; margin: 0; padding: 12px 0; border-top: 1.5px solid var(--strong); border-bottom: 1px solid var(--rule); font-size: 14.5px; }
  .meta div { display: flex; gap: 12px; min-width: 0; }
  .meta dt { color: var(--muted); flex: 0 0 4.5em; }
  .meta dd { margin: 0; overflow-wrap: anywhere; }

  .cmp { display: flex; flex-wrap: wrap; gap: 14px 30px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--rule); font-size: 14.5px; }
  .cmp label, .lbl { color: var(--muted); margin-right: 8px; }
  select { border: 1px solid var(--rule); border-radius: 2px; background: var(--paper); padding: 3px 8px; font-size: 14.5px; max-width: 340px; }
  select.me { border-color: var(--me); color: var(--me); }
  .radio { display: inline-flex; border: 1px solid var(--rule); border-radius: 2px; overflow: hidden; vertical-align: middle; }
  .radio button { border: 0; background: var(--paper); padding: 2px 12px; cursor: pointer; font-size: 14px; }
  .radio button + button { border-left: 1px solid var(--rule); }
  .radio button[aria-pressed=true] { background: var(--strong); color: var(--paper); }
  .radio button:disabled { color: var(--other); cursor: not-allowed; }
  .key { display: inline-block; width: 22px; vertical-align: middle; margin-right: 6px; border-top: 2.5px solid var(--me); }
  .key.ref { border-top: 2px dashed var(--ref); }

  .caption { font-size: 14px; line-height: 1.6; margin: 22px 0 8px; }
  .caption b { font-weight: 600; margin-right: .6em; }
  .figcap { margin: 8px 0 0; }
  table.tab { width: 100%; border-collapse: collapse; border-top: 1.5px solid var(--strong); border-bottom: 1.5px solid var(--strong); font-size: 14.5px; }
  table.tab th { font-weight: 600; text-align: right; padding: 6px 7px; border-bottom: 1px solid var(--strong); white-space: nowrap; }
  table.tab td { text-align: right; padding: 4px 7px; white-space: nowrap; }
  table.tab th:first-child, table.tab td:first-child { text-align: left; padding-left: 2px; }
  table.tab .ci { color: var(--muted); font-size: 12.5px; margin-left: 4px; }
  table.tab tr.pick { cursor: pointer; }
  table.tab tr.pick:hover td { background: var(--wash); }
  table.tab tr.on td { background: var(--sel); }
  table.tab tr.on td:first-child { box-shadow: inset 3px 0 0 var(--me); }
  table.tab td.me { color: var(--me); }
  table.tab td.ref { color: var(--muted); }
  .scroll { overflow-x: auto; }

  .figs { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 36px; align-items: start; }
  figure { margin: 22px 0 0; }
  figure svg { display: block; width: 100%; height: auto; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 13px; color: var(--muted); margin-top: 4px; }
  .oc-row { display: grid; grid-template-columns: minmax(90px, 38%) 1fr; gap: 10px; align-items: center; font-size: 13px; margin: 3px 0; }
  .oc-row span:first-child { text-align: right; overflow-wrap: anywhere; line-height: 1.35; }
  .oc-row.on span:first-child { color: var(--me); font-weight: 600; }
  .oc-bar { display: flex; height: 13px; }
  .oc-bar i { display: block; min-width: 0; }
  .swatch { display: inline-block; width: 10px; height: 10px; margin-right: 5px; vertical-align: -1px; }

  /* 可视化结果 */
  .vr-top { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 32px; align-items: start; }
  .vr-top.noref { grid-template-columns: 1fr; }
  .vr-ctl { display: flex; flex-wrap: wrap; gap: 10px 26px; align-items: center; font-size: 14px; margin-bottom: 12px; }
  .chips { display: inline-flex; flex-wrap: wrap; gap: 6px; }
  .chips button { border: 1px solid var(--rule); background: var(--paper); border-radius: 2px; padding: 1px 10px; cursor: pointer; font-size: 13.5px; }
  .chips button[aria-pressed=true] { border-color: var(--strong); background: var(--strong); color: var(--paper); }
  .grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
  .vr-top:not(.noref) .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .th { border: 0; padding: 0; background: none; cursor: pointer; text-align: left; font-size: 12.5px; line-height: 1.4; }
  .th .im { aspect-ratio: 1; background: var(--wash); display: flex; align-items: center; justify-content: center; color: var(--muted); overflow: hidden; outline: 1px solid var(--rule); }
  .th .im img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .th[aria-current=true] .im { outline: 3px solid var(--me); }
  .th .cap { margin-top: 4px; display: flex; justify-content: space-between; gap: 4px; }
  .more { margin-top: 10px; font-size: 13.5px; display: flex; gap: 16px; align-items: center; }
  .more button { border: 1px solid var(--rule); background: var(--paper); padding: 1px 12px; cursor: pointer; }
  .detail { margin-top: 26px; padding-top: 14px; border-top: 1px solid var(--rule); }
  .dhead { display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: baseline; font-size: 14.5px; }
  .dhead .pn { font-size: 17px; font-weight: 600; }
  .dhead .sp { flex: 1; }
  .dhead button { border: 1px solid var(--rule); background: var(--paper); padding: 1px 12px; cursor: pointer; }
  .views { display: flex; gap: 4px 18px; margin: 12px 0 10px; font-size: 14px; }
  .views button { border: 0; background: none; padding: 0 0 2px; cursor: pointer; color: var(--muted); }
  .views button[aria-pressed=true] { color: var(--ink); border-bottom: 1.5px solid var(--strong); }
  .panes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
  .pane .ttl { font-size: 13.5px; margin-bottom: 4px; display: flex; justify-content: space-between; }
  .pane .box { position: relative; aspect-ratio: 1; background: var(--wash); outline: 1px solid var(--rule); overflow: hidden; }
  .pane .box img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .pane .box .msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 14px; text-align: center; padding: 20px; }
  .pane .box .cut { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1.5px solid #fff; box-shadow: 0 0 0 .5px #000; pointer-events: none; }
  .swipe { width: 100%; margin-top: 10px; }
  .sc svg { cursor: zoom-in; }
  .sc.zoomed svg { cursor: crosshair; }
  .sc .zbar { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: 13px; margin-top: 6px; min-height: 26px; }
  .sc .zbar button { border: 1px solid var(--rule); background: var(--paper); padding: 0 10px; cursor: pointer; font-size: 13px; }

  .tb { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px 28px; }
  .tb .tag { font-size: 13.5px; margin-bottom: 2px; }
  .tbhead { display: flex; justify-content: space-between; align-items: baseline; }
  .tbhead a { font-size: 14px; }

  .notes { min-height: 9em; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 2px; white-space: pre-wrap; outline: none; line-height: 1.85; background: var(--paper); }
  .notes:focus { border-color: var(--me); box-shadow: 0 0 0 1px var(--me); }
  .notes:empty::before { content: "（空）"; color: var(--other); }
  .notes-foot { font-size: 13px; color: var(--muted); margin-top: 6px; }

  /* ================= A 纸面 ================= */
  body[data-style=A] .page { background: var(--paper); max-width: 1240px; margin: 28px auto 90px; padding: 44px 56px 56px; border: 1px solid var(--rule); }
  /* 左栏章节名 + 右栏内容 */
  /* 左侧导航 + 右侧正文 */
  .layout { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 0 40px; }
  .nav { position: sticky; top: 24px; align-self: start; font-size: 14.5px; }
  .nav .back { display: block; margin-bottom: 22px; }
  .nav ol { list-style: none; margin: 0; padding: 0; border-left: 1px solid var(--rule); }
  .nav li a { display: block; padding: 5px 0 5px 14px; margin-left: -1px; border-left: 2px solid transparent; color: var(--muted); }
  .nav li a:hover { color: var(--ink); text-decoration: none; }
  .nav li a[aria-current=true] { color: var(--ink); font-weight: 600; border-left-color: var(--strong); }
  .content { min-width: 0; }
  .content h1 { margin-top: 0; }
  .sec { scroll-margin-top: 20px; }


  /* 原型控制（不属于页面） */
  .proto { position: fixed; left: 14px; bottom: 14px; z-index: 50; background: #2A2F38; color: #D8DCE2; font: 12.5px/1.5 "Microsoft YaHei", sans-serif; padding: 8px 12px 10px; border-radius: 4px; max-width: 360px; box-shadow: 0 4px 16px rgba(0, 0, 0, .25); }
  .proto .t { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 4px; }
  .proto .t button { border: 0; background: none; color: #9AA1AC; cursor: pointer; padding: 0; }
  .proto .row { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; margin-top: 5px; }
  .proto .row > span { width: 30px; color: #9AA1AC; }
  .proto .row button { background: transparent; color: #D8DCE2; border: 1px solid #4A515C; border-radius: 3px; padding: 0 8px; cursor: pointer; }
  .proto .row button[aria-pressed=true] { background: #D8DCE2; color: #2A2F38; }
  .proto p { margin: 6px 0 0; color: #AEB4BD; }

  @media (max-width: 900px) {
    body[data-style] .page { margin: 0; padding: 22px 16px 120px; border: 0; }
    .meta { grid-template-columns: 1fr; }
    .figs, .vr-top, .panes, .tb { grid-template-columns: 1fr; }
    .grid, .vr-top:not(.noref) .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .layout { grid-template-columns: 1fr; } .nav { position: static; margin-bottom: 16px; } .nav ol { display: flex; flex-wrap: wrap; gap: 0 4px; border-left: 0; } .nav li a { padding: 2px 8px; border-left: 0; }
  }
</style>
</head>
<body>
<main class="page" id="app"></main>
<aside class="proto" id="proto" aria-label="原型控制"></aside>
<script>
/* ======================= 数据 ======================= */
const D = window.DATA, R = D.runs, P = D.protocol, MAIN = P.main, MAINU = MAIN.toUpperCase();
const PX = window.PAIRS || null;
const IDENT = 'B0/identity', NONE = '';
const q = new URLSearchParams(location.search);
const S = { exp: R[q.get('exp')] ? q.get('exp') : 'E1', style: 'A',
  method: {}, ref: {}, split: 'val', vf: 'all', vs: 'gain', vn: 12, sel: null, vv: 'swipe', swipe: 50, zstack: [],
  zoom: q.get('zoom') ? Object.fromEntries(['x0', 'x1', 'y0', 'y1'].map((k, i) => [k, +q.get('zoom').split(',')[i]])) : null,   // 调试：直接进入放大状态
  protoOpen: true };
const NOTES = {};

const keyOf = (rid, m) => `${rid}/${m}`;
const ev = (k, s) => { if (!k) return null; const [rid, m] = k.split('/'); return R[rid]?.metrics?.[m]?.[s]; };
const sm = (k, s) => ev(k, s)?.summary;
const methods = r => Object.keys(r.metrics);
const multi = r => methods(r).length > 1;
const ranked = r => methods(r).slice().sort((a, b) => (sm(keyOf(r.id, b), 'val')?.[MAIN] ?? -1) - (sm(keyOf(r.id, a), 'val')?.[MAIN] ?? -1));
const best = r => ranked(r)[0];
const label = k => !k ? '无' : k === IDENT ? '未配准（恒等变换）' : k.endsWith('/main') ? k.slice(0, -5) : k.replace('/', ' / ');
const kids = r => Object.values(R).filter(x => x.meta.parent === r.id);
const curM = r => S.method[r.id] && r.metrics[S.method[r.id]] ? S.method[r.id] : best(r);
function defaultRef(r, m) {
  if (r.meta.init) return r.meta.init;
  const p = R[r.meta.parent];
  if (p?.lit) { const base = m.split('__')[0]; return p.metrics[base] ? keyOf(p.id, base) : keyOf(p.id, best(p)); }
  return r.meta.baseline ? NONE : IDENT;
}
const curRef = r => r.id in S.ref ? S.ref[r.id] : defaultRef(r, curM(r));
const splitOk = (r, s) => !!ev(keyOf(r.id, curM(r)), s) && (!curRef(r) || !!ev(curRef(r), s));
const notesOf = r => NOTES[r.id] ?? r.meta.notes ?? '';

/* ======================= 格式化 ======================= */
const pct = x => x == null ? '—' : (x * 100).toFixed(1);
const pxf = x => x == null ? '—' : x.toFixed(2);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sgn = (d, f) => { if (d == null || isNaN(d)) return '—'; const t = f(Math.abs(d)); return Number(t) === 0 ? t : (d > 0 ? '+' : '−') + t; };
const errTxt = e => e == null ? '失败' : e.toFixed(1);
const SPLIT = () => S.split === 'val' ? 'Val' : 'Test';
const METRICS = () => [...P.auc_thresholds.map(t => [`AUC@${t}`, `auc@${t}`, 'pct']), ...P.sr_thresholds.map(t => [`SR@${t}`, `sr@${t}`, 'pct']),
  ['失败率', 'fail_rate', 'pct'], [`错配率（>${P.t_coarse} px）`, 'mis_rate', 'pct'], ['成功 pair 误差均值（px）', 'succ_mean', 'px'], ['成功 pair 误差中位数（px）', 'succ_median', 'px']];
let TAB = 0, FIG = 0, SEC = 0;
const sec = (id, title, body) => `<section class="sec" id="sec-${id}"><h2><span class="n">${++SEC}</span>${title}</h2><div class="body">${body}</div></section>`;

/* ======================= 页头与比较设置 ======================= */
function header(r) {
  const p = R[r.meta.parent], k = kids(r);
  const rows = [['父实验', p ? `<a onclick="go('${p.id}')">${p.id}</a>` : '无'], ['起点方法', r.meta.init ? esc(r.meta.init) : '无'],
    ['子实验', k.length ? k.map(c => `<a onclick="go('${c.id}')">${c.id}</a>`).join('，') : '无'],
    ['状态', (r.lit ? '已点亮' : '未点亮') + (r.meta.baseline ? '，基线' : '')], ['日期', esc(r.meta.date || '—')],
    ['commit', r.meta.commit ? `<span class="num">${esc(r.meta.commit)}</span>` : '—']];
  if (multi(r)) rows.splice(3, 0, ['方法数', `<span class="num">${methods(r).length}</span>`]);
  return `<div class="head sec" id="sec-info"><div class="hmain"><h1><span class="id">${r.id}</span>${esc(r.meta.title)}</h1>
    <dl class="meta">${rows.map(([t, d]) => `<div><dt>${t}</dt><dd>${d}</dd></div>`).join('')}</dl>${r.lit ? compare(r) : ''}</div></div>`;
}
function refOptions(r) {
  const m = curM(r), def = defaultRef(r, m), cur = curRef(r), groups = [], p = R[r.meta.parent];
  if (p?.lit) groups.push([`父实验 ${p.id}`, ranked(p).map(x => keyOf(p.id, x))]);
  if (multi(r)) groups.push([`本实验 ${r.id}`, ranked(r).filter(x => x !== m).map(x => keyOf(r.id, x))]);
  Object.values(R).filter(x => x.lit && x.id !== r.id && x.id !== p?.id).forEach(x => groups.push([`实验 ${x.id}`, ranked(x).map(y => keyOf(x.id, y)).filter(k => k !== IDENT)]));
  groups.push(['其他', [IDENT, NONE]]);
  const opt = k => `<option value="${k}" ${k === cur ? 'selected' : ''}>${esc(label(k))}${k === def ? '（默认）' : ''}</option>`;
  return groups.map(([g, ks]) => `<optgroup label="${g}">${ks.map(opt).join('')}</optgroup>`).join('');
}
function compare(r) {
  const m = curM(r);
  return `<div class="cmp">
    ${multi(r) ? `<span><label for="selM"><span class="key"></span>方法</label><select id="selM" class="me" onchange="S.method['${r.id}']=this.value;delete S.ref['${r.id}'];resetV();render()">${ranked(r).map(x => `<option value="${x}" ${x === m ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></span>`
      : `<span><span class="key"></span><span class="lbl">方法</span>${esc(label(keyOf(r.id, m)))}</span>`}
    <span><label for="selR"><span class="key ref"></span>参考方法</label><select id="selR" onchange="S.ref['${r.id}']=this.value;resetV();render()">${refOptions(r)}</select></span>
    <span><span class="lbl">数据集</span><span class="radio" role="group" aria-label="数据集"><button aria-pressed="${S.split === 'val'}" onclick="S.split='val';render()">Val</button><button aria-pressed="${S.split === 'test'}" ${splitOk(r, 'test') ? '' : 'disabled title="无 Test 结果"'} onclick="S.split='test';render()">Test</button></span></span>
  </div>`;
}

/* ======================= 表 ======================= */
function methodsTable(r) {
  const s = S.split, cm = curM(r), p = R[r.meta.parent], withBase = p?.lit;
  const cols = [...P.auc_thresholds.map(t => [`AUC@${t}`, `auc@${t}`, pct]), ['SR@5', 'sr@5', pct], ['失败率', 'fail_rate', pct], ['错配率', 'mis_rate', pct], ['误差中位数（px）', 'succ_median', pxf]];
  return `<p class="caption"><b>表 ${++TAB}</b>${r.id} 各方法在 ${SPLIT()} 上的指标，按 ${MAINU} 降序。AUC、SR、失败率、错配率单位为 %；${MAINU} 后为 bootstrap 95% 置信区间；误差中位数只统计成功 pair。${withBase ? `末列为相对父实验 ${p.id} 中同名基础方法的 ${MAINU} 差值。` : ''}点击一行设为当前方法。</p>
    <div class="scroll"><table class="tab num"><tr><th>方法</th>${cols.map(c => `<th>${c[0]}</th>`).join('')}${withBase ? `<th>Δ${MAINU}</th>` : ''}</tr>
    ${ranked(r).map(x => { const k = keyOf(r.id, x), v = sm(k, s) || {}, ci = v[MAIN + '_ci'];
      return `<tr class="pick ${x === cm ? 'on' : ''}" onclick="S.method['${r.id}']='${x}';delete S.ref['${r.id}'];resetV();render()"><td>${esc(x)}</td>
        ${cols.map(([, kk, f]) => `<td>${f(v[kk])}${kk === MAIN && ci ? `<span class="ci">[${pct(ci[0])}, ${pct(ci[1])}]</span>` : ''}</td>`).join('')}
        ${withBase ? `<td>${sgn((v[MAIN] - sm(defaultRef(r, x), s)?.[MAIN]) * 100, a => a.toFixed(1))}</td>` : ''}</tr>`; }).join('')}</table></div>`;
}
function pairTable(r) {
  const s = S.split, k = keyOf(r.id, curM(r)), rf = curRef(r), a = sm(k, s) || {}, b = sm(rf, s) || {};
  return `<p class="caption"><b>表 ${++TAB}</b>${esc(label(k))}${rf ? ` 与参考方法 ${esc(label(rf))}` : ''} 在 ${SPLIT()} 上的全部指标（n = <span class="num">${a.n ?? '—'}</span> 个有标注 pair）。AUC、SR、失败率、错配率单位为 %；方括号内为 bootstrap 95% 置信区间${rf ? '；差值 = 方法 − 参考方法' : ''}。</p>
    <table class="tab num"><tr><th>指标</th><th>${esc(label(k))}</th>${rf ? `<th>${esc(label(rf))}</th><th>差值</th>` : ''}</tr>
    ${METRICS().map(([nm, kk, u]) => { const f = u === 'px' ? pxf : pct, ci = a[kk + '_ci'], cr = b[kk + '_ci'];
      return `<tr><td>${nm}</td><td class="me">${f(a[kk])}${ci ? `<span class="ci">[${pct(ci[0])}, ${pct(ci[1])}]</span>` : ''}</td>

    let g = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t)}"><g font-size="10.5" style="fill:var(--muted)">`;
    for (const y of [lo, (lo + hi) / 2, hi]) g += `<line x1="${L}" x2="${W - 8}" y1="${ys(y)}" y2="${ys(y)}" style="stroke:var(--wash)"/><text x="${L - 5}" y="${ys(y) + 3.5}" text-anchor="end">${fmt(y)}</text>`;
    for (const x of [0, sx / 2, sx]) g += `<text x="${xs(x)}" y="${H - 8}" text-anchor="middle">${x >= 1000 ? x / 1000 + 'k' : x}</text>`;
    g += `<line x1="${L}" x2="${L}" y1="10" y2="${10 + ph}" style="stroke:var(--ink)"/><line x1="${L}" x2="${W - 8}" y1="${10 + ph}" y2="${10 + ph}" style="stroke:var(--ink)"/></g>`;
    g += `<path fill="none" style="stroke:var(--me)" stroke-width="1.5" d="${v.map((y, i) => `${i ? 'L' : 'M'}${xs(st[i]).toFixed(1)},${ys(y).toFixed(1)}`).join('')}"/></svg>`;
    return `<div><div class="tag">${esc(t)}</div>${g}</div>`; }).join('');
  return `<div class="tbhead"><span></span><a href="#" onclick="return false" title="启动 tensorboard --logdir ${esc(r.tb.logdir)} 并打开">在 TensorBoard 中打开</a></div>
    <figure style="margin-top:4px"><div class="tb">${charts}</div><p class="caption figcap"><b>图 ${++FIG}</b>训练过程中记录的标量，横轴为 step。数据读自 ${esc(r.tb.logdir)}/ 下的 TensorBoard 日志。</p></figure>`;
}

/* ======================= 页面 ======================= */
function notes(r) {
  return `<div class="notes" contenteditable="true" spellcheck="false" data-rid="${r.id}" oninput="NOTES[this.dataset.rid]=this.innerText">${esc(notesOf(r))}</div><div class="notes-foot">保存在 runs/${r.id}/notes.md</div>`;
}
function page(r) {
  TAB = 0; FIG = 0; SEC = 0;
  const secs = [];
  if (!r.lit) secs.push(['results', '结果', '<p style="margin:0">尚无结果。</p>']);
  else {
    let res = '';
    if (multi(r)) res += methodsTable(r);
    if (!multi(r) || curRef(r)) res += pairTable(r);
    res += `<div class="figs">${cdfFigure(r)}${outcomeFigure(r)}</div>`;
    secs.push(['results', '结果', res], ['visual', '可视化结果', visual(r)]);
    if (r.tb) secs.push(['train', '训练图表', tbFigure(r)]);
  }
  secs.push(['notes', 'Notes', notes(r)]);
  const nav = [['info', '实验信息'], ...secs.map(([id, t]) => [id, t])];
  return `<div class="layout"><nav class="nav" aria-label="章节"><a class="back" href="${q.get('canvas') ? `../prototype-canvas/index.html?variant=${q.get('canvas')}&focus=${S.exp}` : '#'}">← 画布</a>
      <ol>${nav.map(([id, t]) => `<li><a href="#sec-${id}" data-sec="${id}">${t}</a></li>`).join('')}</ol></nav>
    <div class="content">${header(r)}${secs.map(([id, t, b]) => sec(id, t, b)).join('')}</div></div>`;
}
/* 高亮当前章节：取顶端已越过视口上方 1/4 处的最后一节 */
function markNav() {
  const secs = [...document.querySelectorAll('.content .sec')], y = innerHeight / 4;
  let cur = secs[0]?.id;
  for (const el of secs) if (el.getBoundingClientRect().top <= y) cur = el.id;
  if (innerHeight + scrollY >= document.documentElement.scrollHeight - 2) cur = secs[secs.length - 1]?.id;
  document.querySelectorAll('.nav a[data-sec]').forEach(a => a.setAttribute('aria-current', 'sec-' + a.dataset.sec === cur));
}
addEventListener('scroll', markNav, { passive: true });
function proto() {
  const el = document.getElementById('proto');
  if (!S.protoOpen) { el.innerHTML = `<div class="t" style="margin:0"><span>原型控制</span><button onclick="S.protoOpen=true;proto()">展开</button></div>`; return; }
  el.innerHTML = `<div class="t"><span>原型控制（不属于页面）</span><button onclick="S.protoOpen=false;proto()">收起</button></div>
    <div class="row"><span>实验</span>${Object.keys(R).map(id => `<button aria-pressed="${id === S.exp}" onclick="go('${id}')">${id}</button>`).join('')}</div>
    <p>E1、E2 是模拟实验。E1 的指标和图像借用 B0m / anymatch_roma__minmax 的真实结果。图像只渲染了 ${PX ? Object.keys(PX.rendered).length : 0} 个 Val pair。</p>`;
}
function go(id) { if (R[id]) { S.exp = id; resetV(); render(); scrollTo(0, 0); } }
function render() {
  const r = R[S.exp];
  if (r.lit && !splitOk(r, S.split)) S.split = 'val';
  document.body.dataset.style = S.style;
  const u = new URL(location); u.searchParams.set('exp', S.exp); history.replaceState(null, '', u);
  document.getElementById('app').innerHTML = page(r);
  markNav();
  proto();
}
addEventListener('keydown', e => { if (e.target.closest('input,select,textarea,[contenteditable]')) return;
  if (e.key === 'ArrowLeft') step(-1); if (e.key === 'ArrowRight') step(1); });
render();
if (location.hash) document.querySelector(location.hash)?.scrollIntoView({ behavior: 'instant' });   // 内容由脚本生成，打开时的锚点要手动跳
</script>
</body>
</html>
