<!doctype html>
<!-- PROTOTYPE（一次性）：「节点页内容：自动生成与可编辑的边界」#20，第二版（用 frontend-design 重做）。
     ?exp=B0|B0m|E1|E2 切实验；数据是 data.js 快照（gen_data.py 生成），E1 / E2 是模拟实验。
     编辑只存在内存里，右下角「将写回」显示会写进 repo 的内容。 -->
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE · 节点页 v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<script src="data.js"></script>
<style>
  :root {
    --dust: #E4E6E9; --plate: #F5F6F7; --ink: #18202E; --graphite: #6B7482; --rule: #CDD1D7;
    --signal: #2B4BD8; --signal-wash: #E3E8FB; --gain: #1F7A55; --loss: #B23A30;
    --cn: "DengXian", "等线", "Microsoft YaHei", sans-serif;
    --num: "Barlow", "DengXian", sans-serif; --numc: "Barlow Condensed", "Barlow", sans-serif;
    --paper: #fff; --on-signal: #fff; --st1: #C9CDD3; --st2: #DDE0E4;
  }
  body[data-look=B] {
    --dust: #1C222C; --plate: #252C38; --paper: #2C3442; --ink: #E6E9EE; --graphite: #8792A3; --rule: #353E4C;
    --signal: #F0B45A; --signal-wash: #3A3326; --on-signal: #1C222C; --gain: #4FB38A; --loss: #E0695A;
    --cn: "Microsoft YaHei", "DengXian", sans-serif; --num: "IBM Plex Sans Condensed", "Microsoft YaHei", sans-serif; --numc: "IBM Plex Sans Condensed", sans-serif;
    --st1: #3A4250; --st2: #2E3541;
  }
  body[data-look=C] {
    --dust: #E9ECEF; --plate: #F4F5F7; --paper: #fff; --ink: #1D2230; --graphite: #6A6F78; --rule: #DADDE2;
    --signal: #1D2A5A; --signal-wash: #E6E9F2; --gain: #2F6B3F; --loss: #9C2F2F;
    --cn: "Noto Serif SC", "Source Han Serif SC", "SimSun", serif; --num: "Source Serif 4", "Noto Serif SC", serif; --numc: "Source Serif 4", serif;
    --st1: #E2E4E8; --st2: #F1F2F4;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--dust); color: var(--ink); font: 15px/1.6 var(--num), var(--cn); font-family: var(--num); }
  body, button, select, input, textarea { font-family: var(--num); }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
  .n { font-family: var(--numc); font-variant-numeric: tabular-nums; }
  .gain { color: var(--gain); } .loss { color: var(--loss); } .quiet { color: var(--graphite); }
  a { color: var(--signal); cursor: pointer; }

  /* 原型控件：切实验（不属于设计） */
  .proto { background: #2A2F38; color: #D8DCE2; font-size: 12.5px; padding: 5px 20px; display: flex; gap: 8px; align-items: center; }

  .proto button[aria-pressed=true] { background: #D8DCE2; color: #2A2F38; }

  /* ---------- 顶栏 ---------- */
  .a-rail { display: flex; align-items: center; gap: 18px; padding: 14px 40px 0; font-size: 13.5px; }
  .back { color: var(--graphite); text-decoration: none; }
      .a-rail .spacer { flex: 1; }
  .state { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
  .lamp { width: 9px; height: 9px; border-radius: 50%; background: #F2C230; box-shadow: 0 0 0 3px #F2C23033; }
  .lamp.off { background: transparent; border: 1.5px solid var(--graphite); box-shadow: none; }
  .seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; background: var(--plate); }
  .seg button { border: 0; background: transparent; padding: 3px 11px; font-size: 13px; color: var(--graphite); }

  /* ---------- 标题 + 对比条 ---------- */
  .a-title { padding: 10px 40px 0; max-width: 1320px; }
  .a-title h1 { font: 600 30px/1.25 var(--cn); margin: 0; letter-spacing: .01em; }
  .a-title h1 .id { font-family: var(--numc); font-weight: 600; color: var(--signal); margin-right: 12px; }
  .matchup { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin: 16px 0 0; font-size: 15px; }
  .matchup label { color: var(--graphite); }
  .pick { position: relative; display: inline-flex; align-items: center; }
  .pick select { appearance: none; border: 0; border-bottom: 2px solid currentColor; background: transparent; font: 600 17px var(--num); padding: 2px 24px 2px 2px; color: inherit; cursor: pointer; max-width: 360px; }
  .pick::after { content: "▾"; position: absolute; right: 5px; pointer-events: none; font-size: 13px; }
  .pick.me { color: var(--signal); } .pick.ref { color: var(--graphite); }
  .pick select option, .pick select optgroup { color: var(--ink); font-weight: 400; }
  .swatch { display: inline-block; width: 22px; height: 0; border-top: 3px solid var(--signal); vertical-align: middle; }
  .swatch.ref { border-top: 2px dashed var(--graphite); }

  /* ---------- 主结论（hero） ---------- */
  .a-hero { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 36px; padding: 18px 40px 26px; max-width: 1320px; }

  .ledger { border-left: 1px solid var(--rule); padding-left: 24px; align-self: start; margin-top: 6px; }
  .ledger table { border-collapse: collapse; width: 100%; }
  .ledger th { font: 500 12.5px var(--cn); color: var(--graphite); text-align: right; padding: 0 0 6px 10px; }
  .ledger th:first-child { text-align: left; padding-left: 0; }
  .ledger td { padding: 5px 0 5px 10px; text-align: right; border-top: 1px solid var(--rule); font-family: var(--numc); font-size: 17px; }
  .ledger td:first-child { text-align: left; padding-left: 0; font: 13.5px var(--cn); color: var(--ink); }
  .ledger tr.main td { font-size: 22px; font-weight: 600; }

  .ledger td.me { color: var(--signal); }
  .ledger td.ref { color: var(--graphite); }

  /* 未点亮 */
  .a-hero-dark { padding: 22px 40px 30px; max-width: 1000px; }
  .unlit p { font: 21px/1.6 var(--cn); margin: 0 0 10px; }
  .unlit .cmd { font: 14px Consolas, monospace; background: var(--plate); border: 1px solid var(--rule); padding: 8px 12px; display: inline-block; border-radius: 3px; }

  /* ---------- 块网格 ---------- */

  .blk.text { background: transparent; border-left: 3px solid var(--rule); border-radius: 0; }

  .editable:hover { background: var(--paper); }
  .editable:focus { background: var(--paper); box-shadow: 0 0 0 2px var(--signal); }
  .editable:empty::before { content: attr(data-ph); color: #9AA1AC; }

  /* 编辑模式 */
  body.editing .a-board { background-image: linear-gradient(var(--rule) 1px, transparent 1px); background-size: 100% 24px; }
  body.editing .blk { outline: 1.5px dashed #9AA1AC; outline-offset: 3px; }

  body.editing .blk.over { outline: 2px solid var(--signal); }
  .tools { display: none; position: absolute; top: 10px; right: 12px; gap: 4px; }
  body.editing .tools { display: flex; }
  .tools button { border: 1px solid var(--rule); background: var(--paper); font-size: 12.5px; padding: 2px 8px; border-radius: 3px; color: var(--ink); }
  .tools .grip { cursor: grab; letter-spacing: -2px; color: var(--graphite); }
  .drawer { display: none; position: fixed; top: 0; right: 0; bottom: 0; width: 280px; background: var(--paper); color: var(--ink); border-left: 1px solid var(--rule); padding: 20px; z-index: 20; overflow: auto; }
  body.editing .drawer { display: block; }
  body.editing { padding-right: 280px; }
  .drawer h3 { font: 600 15px var(--cn); margin: 0 0 4px; }
  .drawer p { font: 13px/1.6 var(--cn); color: var(--graphite); margin: 0 0 14px; }
  .drawer .item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-top: 1px solid var(--rule); font: 14px var(--cn); }
  .drawer .item button { border: 1px solid var(--signal); color: var(--signal); background: transparent; border-radius: 3px; padding: 1px 10px; font-size: 13px; }
  .drawer .done { margin-top: 18px; width: 100%; background: var(--signal); color: #fff; border: 0; border-radius: 4px; padding: 8px; font: 600 14px var(--cn); }
  .drawer .reset { margin-top: 8px; width: 100%; background: transparent; border: 1px solid var(--rule); border-radius: 4px; padding: 6px; font: 13px var(--cn); color: var(--graphite); }

  /* 块内部件 */
  .oc-row { display: grid; grid-template-columns: minmax(80px, 34%) 1fr; gap: 10px; align-items: center; margin: 4px 0; font-size: 13px; }
  .oc-name { text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .oc-bar { display: flex; height: 16px; }
  .oc-bar i { display: block; min-width: 0; }
  .oc-key { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--graphite); margin-top: 8px; }
  .oc-key i { display: inline-block; width: 10px; height: 10px; margin-right: 5px; vertical-align: -1px; }
  .c-side .oc-row { grid-template-columns: 1fr; gap: 2px; } .c-side .oc-name { text-align: left; }
  .rank { width: 100%; border-collapse: collapse; }
  .rank td { padding: 3px 0; font-size: 14px; }
  .rank tr { cursor: pointer; }
  .rank tr:hover td { background: #fff; }
  .rank tr.on td { background: var(--signal-wash); }
  .rank .nm { width: 30%; padding-right: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 0; }
  .rank .bar { width: 50%; }
  .rank .bar div { height: 12px; background: var(--ink); border-radius: 1px; }
  .rank tr.on .bar div { background: var(--signal); }
  .rank .bar div.dead { background: var(--rule); }
  .rank .v { text-align: right; font-family: var(--numc); font-size: 16px; width: 10%; }
  .rank .d { text-align: right; font-family: var(--numc); font-size: 14px; width: 10%; }
  .full-table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .full-table th { text-align: right; font: 500 12.5px var(--cn); color: var(--graphite); padding: 4px 8px; }
  .full-table td { text-align: right; padding: 4px 8px; border-top: 1px solid var(--rule); font-family: var(--numc); font-size: 15.5px; }
  .full-table td:first-child, .full-table th:first-child { text-align: left; font-family: var(--cn); font-size: 13.5px; }
  .pv { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 18px; }
  .pv .cats button { display: flex; justify-content: space-between; width: 100%; border: 0; border-top: 1px solid var(--rule); background: transparent; padding: 8px 2px; font: 14px var(--cn); color: var(--ink); text-align: left; }
  .pv .cats button[aria-pressed=true] { background: var(--signal-wash); }
  .pv .cats .n { font-size: 17px; }
  .pv .stage { height: 330px; background: repeating-conic-gradient(var(--st1) 0 25%, var(--st2) 0 50%) 0 0 / 48px 48px; position: relative; border-radius: 2px; }
  .pv .stage .ph { position: absolute; inset: auto 12px 12px auto; background: var(--paper); font: 12.5px var(--cn); padding: 6px 10px; border-radius: 3px; color: var(--graphite); max-width: 340px; }
  .pv .views { display: flex; gap: 14px; font: 13px var(--cn); color: var(--graphite); margin-bottom: 8px; flex-wrap: wrap; }
  .pv .views span[aria-current] { color: var(--ink); font-weight: 600; border-bottom: 2px solid var(--signal); }
  .kids a { display: block; text-decoration: none; padding: 6px 0; border-top: 1px solid var(--rule); font: 14.5px var(--cn); }
  .kids a .id { font-family: var(--numc); font-weight: 600; margin-right: 8px; }

  /* 将写回 */
  .writeback { position: fixed; left: 16px; bottom: 16px; z-index: 30; font-size: 12.5px; }
  .writeback > button { background: #2A2F38; color: #fff; border: 0; border-radius: 4px; padding: 6px 12px; font: 12.5px var(--cn); }
  .writeback pre { margin: 6px 0 0; background: #2A2F38; color: #D8DCE2; padding: 10px 12px; border-radius: 4px; max-width: 420px; max-height: 40vh; overflow: auto; white-space: pre-wrap; font: 12px/1.5 Consolas, monospace; }

  /* ---------- B：暗场看图台 ---------- */
  .b-wrap { display: grid; grid-template-columns: 380px minmax(0, 1fr); min-height: calc(100vh - 30px); }
  .b-side { background: var(--plate); border-right: 1px solid var(--rule); padding: 18px 24px 110px; position: sticky; top: 0; height: 100vh; overflow: auto; }
  .b-side h1 { font: 600 19px/1.4 var(--cn); margin: 12px 0 4px; }
  .b-side h1 .id { display: block; font: 600 46px/1 var(--numc); color: var(--signal); margin-bottom: 8px; }
  .b-meta { font-size: 13px; color: var(--graphite); }
  .b-state { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 12px 0 14px; }
  .b-side .matchup { flex-direction: column; align-items: flex-start; gap: 2px; border-top: 1px solid var(--rule); padding-top: 12px; margin-top: 0; }
  .b-side .matchup label { margin-top: 6px; font-size: 13px; }
  .b-side .pick select { max-width: 320px; }
  .b-side .claim { font-size: 16px; line-height: 1.65; margin: 16px 0 12px; }
  .b-side .claim .sub { font-size: 14px; }
  .b-side .ledger { border-left: 0; padding-left: 0; margin: 0 0 14px; }
  .b-side .blk { background: transparent; padding: 12px 0 6px; border-left: 0; border-top: 1px solid var(--rule); border-radius: 0; margin-top: 10px; }
  .b-side .blk h2 { font-size: 13.5px; color: var(--graphite); }
  .b-main { padding: 16px 28px 120px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .b-top { display: flex; justify-content: flex-end; }
  .b-main .blk { padding: 18px 22px; border: 1px solid var(--rule); }
  .b-stagebig .pv .stage { height: 540px; }
  .b-cdf { padding: 4px 4px 0; } .b-cdf svg { max-height: 300px; }
  .b-main .rank .bar div { background: var(--graphite); }
  .b-main .rank tr.on .bar div { background: var(--signal); }
  body[data-look=B] .unlit p { font-size: 17px; }

  /* ---------- C：实验记录本 ---------- */
  .c-desk { padding: 34px 24px 120px; }
  .c-page { background: var(--paper); max-width: 1160px; margin: 0 auto; padding: 44px 60px 64px; position: relative; border: 1px solid var(--rule); }
  .c-page h1 { font: 600 33px/1.3 var(--cn); margin: 14px 0 6px; max-width: 24em; }
  .c-page h1 .id { color: var(--signal); margin-right: 14px; font-family: var(--num); }
  .c-meta { color: var(--graphite); margin: 0 0 20px; }
  .c-corner { position: absolute; top: 22px; right: 28px; display: flex; gap: 12px; align-items: center; }
  .c-matchup { font: 17px/2.1 var(--cn); border-top: 2px solid var(--ink); border-bottom: 1px solid var(--rule); padding: 10px 0; margin: 0 0 26px; }
  .c-matchup .me-t { color: var(--signal); }
  .c-matchup .pick select { font: 600 17px var(--num); }
  .c-grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; column-gap: 52px; row-gap: 30px; grid-auto-flow: row dense; align-items: start; }
  .c-grid > .c-main { grid-column: 1; } .c-grid > .c-side { grid-column: 2; }
  .c-page .blk { background: transparent; padding: 0; border-radius: 0; }
  .c-page .blk.text { border-left: 0; }
  .c-page .blk h2 { font: 600 17px var(--cn); border-top: 1px solid var(--rule); padding-top: 10px; }
  .c-page .c-side .blk h2 { font-size: 14.5px; }
  .c-page .claim { font: 20px/1.8 var(--cn); max-width: none; }
  .c-page .claim b { font-family: var(--num); }
  .c-side .ledger { border-left: 0; padding-left: 0; margin-top: 0; }
  .c-page .pv { grid-template-columns: 190px minmax(0, 1fr); }
  .c-page .editable { font: 16.5px/1.85 var(--cn); }
  body.editing .c-grid > .blk { outline-offset: 8px; }

  /* 方向切换（原型控件） */
  .lookbar { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 40; display: flex; align-items: center; gap: 6px; background: #2A2F38; color: #fff; border-radius: 22px; padding: 5px 7px; font: 13.5px "Microsoft YaHei", sans-serif; box-shadow: 0 3px 14px rgba(0, 0, 0, .3); }
  .lookbar button { width: 30px; height: 30px; border-radius: 50%; border: 0; background: #444C58; color: #fff; font-size: 15px; }
  .lookbar span { min-width: 170px; text-align: center; }

  @media (max-width: 900px) {
    .a-hero { grid-template-columns: 1fr; } .ledger { border-left: 0; padding-left: 0; }
    .a-board { grid-template-columns: 1fr; } .a-board .blk.full { grid-column: span 1; }
    .b-wrap { grid-template-columns: 1fr; } .b-side { position: static; height: auto; }
    .c-page { padding: 24px 18px; } .c-grid { grid-template-columns: 1fr; } .c-grid > .c-side { grid-column: 1; } .c-corner { position: static; margin-bottom: 10px; flex-wrap: wrap; }
    .a-rail, .a-title, .a-hero, .a-board, .a-hero-dark { padding-left: 16px; padding-right: 16px; }
    .pv { grid-template-columns: 1fr; }
    body.editing { padding-right: 0; } .drawer { width: 100%; top: auto; height: 45vh; border-top: 1px solid var(--rule); }
  }
  @media (prefers-reduced-motion: no-preference) { .gapfill { animation: reveal .6s ease-out both; } @keyframes reveal { from { opacity: 0; } } }
</style>

<body>
<div class="proto" id="proto"></div>
<div id="app"></div>
<aside class="drawer" id="drawer" aria-label="块库"></aside>
<div class="writeback" id="wb"></div>
<div class="lookbar" role="group" aria-label="切换视觉方向"><button onclick="cycle(-1)" aria-label="上一个方向">←</button><span id="lookname"></span><button onclick="cycle(1)" aria-label="下一个方向">→</button></div>
<script>
/* ======================= 数据 ======================= */
const D = window.DATA, R = D.runs, P = D.protocol, MAIN = P.main, MAINU = MAIN.toUpperCase();
const IDENT = 'B0/identity', NOREF = '';
const EXPS = { B0: '基线，18 个方法（真实）', B0m: '基线消融，只有 Val（真实）', E1: '单方法，已点亮（模拟）', E2: '未点亮的想法（模拟）' };
const q = new URLSearchParams(location.search);
const S = { look: ['A', 'B', 'C'].includes(q.get('look')) ? q.get('look') : 'A', exp: R[q.get('exp')] ? q.get('exp') : 'E1', method: {}, ref: {}, split: 'val', edit: q.get('edit') === '1', cat: 'fixed', wbOpen: false };

const keyOf = (rid, m) => `${rid}/${m}`;
const ev = (k, s) => { if (!k) return null; const [rid, m] = k.split('/'); return R[rid]?.metrics?.[m]?.[s]; };
const sm = (k, s) => ev(k, s)?.summary;
const methods = r => Object.keys(r.metrics);
const multi = r => methods(r).length > 1;
const mainOf = (k, s = 'val') => sm(k, s)?.[MAIN];
const ranked = r => methods(r).slice().sort((a, b) => (mainOf(keyOf(r.id, b)) ?? -1) - (mainOf(keyOf(r.id, a)) ?? -1));
const best = r => ranked(r)[0];
const label = k => !k ? '不对比' : k === IDENT ? '未配准' : k.endsWith('/main') ? k.slice(0, -5) : k.replace('/', ' / ');
const kids = r => Object.values(R).filter(x => x.meta.parent === r.id);
const curM = r => S.method[r.id] && r.metrics[S.method[r.id]] ? S.method[r.id] : best(r);

    cap = `<span><i style="background:${T().gain}38"></i>本方法更好的区间</span><span><i style="background:${T().loss}38"></i>对比方法更好的区间</span>`; }
  else if (multi(r)) { const top = ranked(r).slice(0, 5); if (!top.includes(m)) top.push(m);
    lines = top.map((x, i) => ({ k: keyOf(r.id, x), color: x === m ? T().me : T().top[i % T().top.length], w: x === m ? 2.8 : 1.3 }));
    cap = lines.map(l => `<span><i style="background:${l.color};height:3px"></i>${esc(l.k.split('/')[1])}</span>`).join('') + '<span>排名前五；选一个对比方法可以看差异区间</span>'; }
  else { lines = [{ k, color: T().me, w: 2.6 }]; cap = ''; }
  return `<div class="cdf">${cdfSvg(lines, S.split, gap)}</div><div class="cdfcap"><span>纵轴：误差不超过横轴值的 pair 占比</span>${cap}</div>`;
}
function verdictSeg(r) {
  const v = VERDICT[r.id] ?? r.meta.verdict_tag ?? '';
  return r.lit && !r.meta.baseline ? `<span class="seg" role="group" aria-label="判定">${[['', '未判定'], ['kept', '保留'], ['dropped', '放弃']].map(([x, n]) => `<button aria-pressed="${v === x}" onclick="VERDICT['${r.id}']='${x}';render()">${n}</button>`).join('')}</span>` : '';
}
const stateTag = r => `<span class="state"><span class="lamp ${r.lit ? '' : 'off'}"></span>${r.lit ? '已点亮' : '未点亮'}${r.meta.baseline ? '，基线' : ''}</span>`;
const editBtn = () => `<button class="editbtn" aria-pressed="${S.edit}" onclick="S.edit=!S.edit;render()">${S.edit ? '完成编辑' : '编辑页面'}</button>`;
function lineageText(r) {
  const p = R[r.meta.parent];
  return p ? `派生自 <a onclick="go('${p.id}')">${p.id}</a>${r.meta.init ? `，从 ${esc(r.meta.init)} 起步` : ''}` : '根实验';
}

/* ======================= 块（三个方向共用） ======================= */
/* 宽度开关在不同方向里含义不同：A 半宽 / 整宽；C 边栏 / 正文；B 没有 */
const WLABEL = { A: ['改成半宽', '改成整宽'], C: ['放进边栏', '放回正文'] };
function blk(r, b, extraCls = '') {
  const [n, fn, , isText, hint] = BLOCKS[b], w = width(r, b), wl = WLABEL[S.look];
  return `<section class="blk ${w} ${isText ? 'text' : ''} ${extraCls}" data-b="${b}" draggable="${S.edit}">
    <div class="tools"><button class="grip" title="拖动排序" aria-label="拖动排序">⋮⋮</button>
      <button onclick="mv('${b}',-1)" aria-label="上移">↑</button><button onclick="mv('${b}',1)" aria-label="下移">↓</button>
      ${wl ? `<button onclick="cfg(R[S.exp]).width['${b}']='${w === 'full' ? 'half' : 'full'}';render()">${w === 'full' ? wl[0] : wl[1]}</button>` : ''}
      <button onclick="setOrder(R[S.exp], shown(R[S.exp]).filter(x=>x!=='${b}'))">隐藏</button></div>
    <h2>${n}${S.edit ? `<span class="hint">${hint}</span>` : ''}</h2>${fn(r)}</section>`;
}

/* ======================= A：月尘灰判读台 ======================= */
function layoutA(r) {
  return `<nav class="a-rail"><a class="back" href="#" onclick="return false">← 画布</a><span class="quiet">${lineageText(r)}</span>
      ${r.meta.date ? `<span class="quiet">${esc(r.meta.date)}</span>` : ''}<span class="spacer"></span>${stateTag(r)}${verdictSeg(r)}${editBtn()}</nav>
    <header class="a-title"><h1><span class="id">${r.id}</span>${esc(r.meta.title)}</h1>${r.lit ? matchup(r) : ''}</header>
    ${r.lit ? `<section class="a-hero"><div><p class="claim">${claim(r)}</p>${cdfFig(r)}</div>${ledger(r)}</section>` : `<section class="a-hero-dark">${unlit(r)}</section>`}
    <main class="a-board">${shown(r).map(b => blk(r, b)).join('')}</main>`;
}

/* ======================= B：暗场看图台 =======================
   左边固定仪表栏：对比选择、读数、累积分布、文字；右边主区先给大图。文字类块归侧栏，其余归主区。 */
const sideB = b => BLOCKS[b][3] || b === 'kids';
function layoutB(r) {
  const sb = shown(r).filter(sideB), mb = shown(r).filter(b => !sideB(b));
  return `<div class="b-wrap"><aside class="b-side">
      <a class="back" href="#" onclick="return false">← 画布</a>
      <h1><span class="id">${r.id}</span>${esc(r.meta.title)}</h1>
      <div class="b-meta">${lineageText(r)}${r.meta.date ? `<br>${esc(r.meta.date)}` : ''}</div>
      <div class="b-state">${stateTag(r)}${verdictSeg(r)}</div>
      ${r.lit ? `${matchup(r)}<p class="claim">${claim(r)}</p>${ledger(r)}` : unlit(r)}
      <div class="b-sideblocks">${sb.map(b => blk(r, b)).join('')}</div>
    </aside>
    <main class="b-main"><div class="b-top">${editBtn()}</div>${r.lit ? `<section class="b-cdf">${cdfFig(r)}</section>` : ''}${mb.map(b => blk(r, b, b === 'pairs' ? 'b-stagebig' : '')).join('') || '<p class="quiet">主区还没有块。点「编辑页面」从块库加入。</p>'}</main></div>`;
}

/* ======================= C：实验记录本 =======================
   一页纸：正文一栏 + 右侧边栏。选择器嵌在句子里；块可以放正文或边栏（宽度开关）。 */
function matchupC(r) {
  const m = curM(r), k = keyOf(r.id, m), rf = curRef(r), testOk = hasSplit(k, 'test') && (!rf || hasSplit(rf, 'test'));
  const me = multi(r) ? `<span class="pick me"><select aria-label="本方法" onchange="S.method['${r.id}']=this.value;delete S.ref['${r.id}'];render()">${ranked(r).map(x => `<option value="${x}" ${x === m ? 'selected' : ''}>${esc(x)}　${pct(mainOf(keyOf(r.id, x)))}</option>`).join('')}</select></span>` : `<b class="me-t">${esc(r.id)}</b>`;
  return `<p class="c-matchup">这一页看 ${me}，对比 <span class="pick ref"><select aria-label="对比方法" onchange="S.ref['${r.id}']=this.value==='@default'?undefined:this.value;if(S.ref['${r.id}']===undefined)delete S.ref['${r.id}'];render()">${refOptions(r)}</select></span>，数据用
    <span class="seg" role="group" aria-label="数据集"><button aria-pressed="${S.split === 'val'}" onclick="S.split='val';render()">Val</button><button aria-pressed="${S.split === 'test'}" ${testOk ? '' : 'disabled title="这组对比没有 Test 结果"'} onclick="S.split='test';render()">Test</button></span>。
    ${S.split === 'test' ? '<span class="loss">正在看 Test，判定只看 Val。</span>' : ''}</p>`;
}
function layoutC(r) {
  return `<div class="c-desk"><article class="c-page">
    <div class="c-corner">${stateTag(r)}${verdictSeg(r)}${editBtn()}</div>
    <a class="back" href="#" onclick="return false">← 画布</a>
    <h1><span class="id">${r.id}</span>${esc(r.meta.title)}</h1>
    <p class="c-meta">${lineageText(r)}${r.meta.date ? `，${esc(r.meta.date)}` : ''}</p>
    ${r.lit ? matchupC(r) : ''}
    <div class="c-grid">
      ${r.lit ? `<div class="c-main"><p class="claim">${claim(r)}</p>${cdfFig(r)}</div><div class="c-side">${ledger(r)}</div>` : `<div class="c-main">${unlit(r)}</div>`}
      ${shown(r).map(b => blk(r, b, width(r, b) === 'full' ? 'c-main' : 'c-side')).join('')}
    </div></article></div>`;
}

/* ======================= 外壳 ======================= */
function drawer(r) {
  const av = available(r);
  const how = { A: '块可以拖动排序，也可以用块上的按钮移动、改宽度、隐藏。', B: '文字类块在左栏，图表类块在右边主区，各自拖动排序。', C: '块可以拖动排序；「放进边栏 / 放回正文」决定它在页面哪一栏。' }[S.look];
  return `<h3>块库</h3><p>${how}隐藏的块回到这里。指标和图表都是自动生成的，文字块直接点进去写。</p>
    ${av.length ? av.map(b => `<div class="item"><span>${BLOCKS[b][0]}</span><button onclick="setOrder(R[S.exp],[...shown(R[S.exp]),'${b}'])">加入</button></div>`).join('') : '<p>所有块都已经在页面上。</p>'}
    <button class="reset" onclick="delete CFG[S.look+':'+S.exp];render()">恢复默认布局</button><button class="done" onclick="S.edit=false;render()">完成编辑</button>`;
}
function mv(b, d) { const r = R[S.exp], o = shown(r).slice(), i = o.indexOf(b), j = i + d; if (j < 0 || j >= o.length) return; [o[i], o[j]] = [o[j], o[i]]; setOrder(r, o); }
function writeback() {
  const L = [];
  for (const [key, c] of Object.entries(CFG)) {
    const [look, rid] = key.split(':'), w = Object.fromEntries(Object.entries(c.width).filter(([b, v]) => v !== BLOCKS[b][2]));
    if (!c.order && !Object.keys(w).length) continue;
    L.push(`# runs/${rid}/page.toml（方向 ${look}）`); if (c.order) L.push(`blocks = ${JSON.stringify(c.order)}`); for (const [b, v] of Object.entries(w)) L.push(`width.${b} = "${v}"`); L.push('');
  }
  const ex = {}; for (const [rid, f] of Object.entries(TEXT)) for (const [k, v] of Object.entries(f)) if ((R[rid].meta[k] ?? '').trim() !== v) (ex[rid] ??= []).push(`${k} = ${JSON.stringify(v)}`);
  for (const [rid, v] of Object.entries(VERDICT)) (ex[rid] ??= []).push(`verdict_tag = "${v}"`);
  for (const [rid, ls] of Object.entries(ex)) L.push(`# runs/${rid}/exp.toml`, ...ls, '');
  return `<button onclick="S.wbOpen=!S.wbOpen;render()">将写回 repo 的内容${L.length ? '' : '：无'}</button>${S.wbOpen ? `<pre>${esc(L.join('\n') || '还没有改动。页面布局改动写进 runs/<id>/page.toml，文字和判定写进 exp.toml。')}</pre>` : ''}`;
}
function go(id) { if (R[id]) { S.exp = id; S.cat = 'fixed'; if (!hasSplit(keyOf(id, curM(R[id])), S.split)) S.split = 'val'; render(); scrollTo(0, 0); } }
const LK = Object.keys(LOOKS);
function cycle(d) { S.look = LK[(LK.indexOf(S.look) + d + LK.length) % LK.length]; render(); }
function render() {
  const r = R[S.exp];
  if (S.split === 'test') { const rf = curRef(r); if (!hasSplit(keyOf(r.id, curM(r)), 'test') || (rf && !hasSplit(rf, 'test'))) S.split = 'val'; }
  const u = new URL(location); u.searchParams.set('exp', S.exp); u.searchParams.set('look', S.look); history.replaceState(null, '', u);
  document.body.dataset.look = S.look;
  document.body.classList.toggle('editing', S.edit);
  document.getElementById('proto').innerHTML = `<b>PROTOTYPE</b><span>换一个实验看：</span>${Object.keys(EXPS).map(id => `<button aria-pressed="${id === S.exp}" onclick="go('${id}')">${id}</button>`).join('')}<span>${EXPS[S.exp]}</span>`;
  document.getElementById('app').innerHTML = { A: layoutA, B: layoutB, C: layoutC }[S.look](r);
  document.getElementById('drawer').innerHTML = drawer(r);
  document.getElementById('wb').innerHTML = writeback();
  document.getElementById('lookname').textContent = `${S.look}　${LOOKS[S.look]}`;
}
/* 文字块：失焦时写回 */
document.addEventListener('focusout', e => { const el = e.target.closest?.('.editable'); if (!el) return;
  (TEXT[el.dataset.rid] ??= {})[el.dataset.field] = el.innerText.trim(); document.getElementById('wb').innerHTML = writeback(); });
/* 拖动排序 */
let dragB = null;
document.addEventListener('dragstart', e => { const b = e.target.closest?.('.blk'); if (!b || !S.edit) return; dragB = b.dataset.b; b.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; });
document.addEventListener('dragover', e => { const b = e.target.closest?.('.blk'); if (!dragB || !b) return; e.preventDefault(); document.querySelectorAll('.blk.over').forEach(x => x.classList.remove('over')); b.classList.add('over'); });
document.addEventListener('drop', e => { const b = e.target.closest?.('.blk'); if (!dragB || !b) return; e.preventDefault();
  const r = R[S.exp], o = shown(r).filter(x => x !== dragB); o.splice(o.indexOf(b.dataset.b) + (b.dataset.b === dragB ? 0 : 0), 0, dragB); dragB = null; setOrder(r, o); });
document.addEventListener('dragend', () => { dragB = null; document.querySelectorAll('.dragging,.over').forEach(x => x.classList.remove('dragging', 'over')); });
addEventListener('keydown', e => { if (e.target.closest('input,textarea,select,[contenteditable]')) return; if (e.key === 'ArrowLeft') cycle(-1); if (e.key === 'ArrowRight') cycle(1); });
render();
</script>
</body>
